<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>measure-credentials</title>
    <style>
      body { margin: 0; font: 12px monospace; }
      iframe { width: 430px; height: 900px; border: 0; }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <!-- 430x900 iframe 模拟小程序视口；只给 DOM 数字，不靠 vision 猜 -->
    <iframe id="f" src="/index.html#/pages/credentials/index"></iframe>
    <pre id="m">pending</pre>
    <script>
      function collect(doc, win) {
        const over = []
        doc.querySelectorAll('*').forEach(function (el) {
          const r = el.getBoundingClientRect()
          if (r.width > 0 && r.right > win.innerWidth + 0.5) {
            over.push({ tag: el.tagName, cls: String(el.className || '').slice(0, 70), right: Math.round(r.right) })
          }
        })
        function rect(sel) {
          const el = doc.querySelector(sel)
          if (!el) return null
          const r = el.getBoundingClientRect()
          return { x: Math.round(r.x), top: Math.round(r.top), right: Math.round(r.right), bottom: Math.round(r.bottom), w: Math.round(r.width) }
        }
        function texts(sel) {
          return Array.prototype.map.call(doc.querySelectorAll(sel), function (e) { return e.textContent.trim() })
        }
        function colors(sel) {
          return Array.prototype.map.call(doc.querySelectorAll(sel), function (e) { return win.getComputedStyle(e).backgroundColor })
        }
        const text = (doc.body && doc.body.innerText) || ''
        const need = [
          '凭证列表', '统一管理客户检测凭证', '接入凭证', '共 10 条',
          '待检测', '检测中', '不通过', '通过',
          '凭证名称', '模型数', '状态', '查看', '报告',
          '华东主线路 · GPT 通道', '华北备用 · Claude 通道', '华南专线 · Gemini 通道', '华东测试 · GPT 通道',
          '华中主线路 · Claude 通道', '华南备用 · GPT 通道', '西南专线 · 通义通道', '华北主线路 · Gemini 通道',
          '华东灰度 · DeepSeek 通道', '港澳线路 · GPT 通道',
          '2026-07-10 14:08:21', '仅展示最近接入的 10 条凭证记录',
          '工作台', '报价', '我的'
        ]
        const tabbar = rect('.tabbar')
        const card = rect('.cred-card')
        const viewportH = win.innerHeight
        const snapshot = {
          innerWidth: win.innerWidth,
          innerHeight: viewportH,
          docScrollWidth: doc.documentElement.scrollWidth,
          docScrollHeight: Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight),
          overflowingCount: over.length,
          overflowing: over.slice(0, 20),
          missingTexts: need.filter(function (t) { return text.indexOf(t) === -1 }),
          chipCount: doc.querySelectorAll('.chip').length,
          chipTexts: texts('.chip'),
          chipColors: colors('.chip__dot'),
          rowCount: doc.querySelectorAll('[data-testid="cred-row"]').length,
          reportCount: doc.querySelectorAll('[data-testid^="row-report-"]').length,
          rowDotColors: colors('.cred-row__dot').slice(0, 4),
          caption: texts('.cred-card__footer-text'),
          listTotal: (function () { const e = doc.querySelector('[data-testid="list-total"]'); return e ? e.textContent.trim() : null })(),
          firstRow: texts('[data-testid="cred-row"]')[0] || null,
          headTexts: texts('.cred-card__th'),
          card: card,
          nameColW: (rect('.cred-row__name-col') || {}).w,
          modelsColW: (rect('.cred-row__models') || {}).w,
          statusColW: (rect('.cred-row__status') || {}).w,
          viewColW: (rect('.cred-row__view') || {}).w,
          tabbarTop: tabbar ? tabbar.top : null,
          tabbarBottom: tabbar ? tabbar.bottom : null,
          tabbarPinned: tabbar ? Math.abs(tabbar.bottom - viewportH) <= 2 : null,
          cardBottom: card ? card.bottom : null,
          submitBtn: rect('[data-testid="submit-btn"]'),
          bodyBg: win.getComputedStyle(doc.querySelector('.cred')).backgroundColor,
          topbarBg: win.getComputedStyle(doc.querySelector('.cred__topbar')).backgroundColor,
          submitBg: win.getComputedStyle(doc.querySelector('[data-testid="submit-btn"]')).backgroundColor
        }
        // 固定 TabBar 在滚动到顶时会盖住卡片尾部，故滚到底再取一次几何（此时应完全不遮挡）
        win.scrollTo(0, 1e6)
        const cardAtBottom = rect('.cred-card')
        const tbAtBottom = rect('.tabbar')
        snapshot.scrollYMax = win.scrollY
        snapshot.atBottom = {
          cardTop: cardAtBottom ? cardAtBottom.top : null,
          cardBottom: cardAtBottom ? cardAtBottom.bottom : null,
          tabbarTop: tbAtBottom ? tbAtBottom.top : null,
          cardFullyAboveTabbar: cardAtBottom && tbAtBottom ? cardAtBottom.bottom <= tbAtBottom.top + 1 : null
        }
        win.scrollTo(0, 0)
        return snapshot
      }
      setTimeout(function () {
        try {
          const f = document.getElementById('f')
          const payload = collect(f.contentDocument, f.contentWindow)
          const fr = document.getElementById('f').getBoundingClientRect()
          payload.iframeRect = { x: Math.round(fr.x), y: Math.round(fr.y), w: Math.round(fr.width), h: Math.round(fr.height) }
          payload.outerInnerWidth = window.innerWidth
          document.getElementById('m').textContent = 'MEASURE_JSON:' + JSON.stringify(payload)
        } catch (e) {
          document.getElementById('m').textContent = 'MEASURE_JSON:{"error":"' + e.message + '"}'
        }
      }, 5000)
    </script>
  </body>
</html>
