<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>diag-uni</title>
    <style>
      body { margin: 0; font: 12px monospace; }
      iframe { width: 430px; height: 400px; border: 0; }
      #sink { position: absolute; top: 0; left: 0; width: 0; height: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- 诊断：uni-app H5 里 window.uni 的可写性 / downloadFile / openDocument 是否存在（决定取证方式） -->
    <iframe id="f" src="/index.html#/pages/contract/index?contractId=c1"></iframe>
    <div id="sink"><pre id="m">pending</pre></div>
    <script>
      var f = document.getElementById('f')
      function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms) }) }
      async function main() {
        await sleep(3000)
        var out = {}
        try {
          var w = f.contentWindow
          var d = Object.getOwnPropertyDescriptor(w, 'uni')
          out.descriptor = d ? { writable: !!d.writable, configurable: !!d.configurable, hasGet: typeof d.get === 'function', hasValue: 'value' in d } : null
          out.typeofUni = typeof w.uni
          out.hasDownloadFile = typeof (w.uni && w.uni.downloadFile)
          out.hasOpenDocument = typeof (w.uni && w.uni.openDocument)
          out.isProxy = !!(w.uni && w.uni.__esModule)
          var orig = w.uni && w.uni.downloadFile
          try {
            w.uni.downloadFile = function () { return 'PATCHED' }
          } catch (e) { out.patchThrew = String(e && e.message) }
          out.patchStuck = !!(w.uni && w.uni.downloadFile && w.uni.downloadFile() === 'PATCHED')
          if (orig) { try { w.uni.downloadFile = orig } catch (e) {} }
          out.allKeys = w.uni ? Object.keys(w.uni).filter(function (k) { return /download|open|document|File/i.test(k) }) : null
        } catch (e) {
          out.err = String(e && e.message)
        }
        document.getElementById('m').textContent = 'DIAG_JSON:' + JSON.stringify(out)
      }
      main()
    </script>
  </body>
</html>
