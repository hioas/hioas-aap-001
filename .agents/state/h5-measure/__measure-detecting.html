<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>measure-detecting</title>
    <style>
      body { margin: 0; font: 12px monospace; }
      /* 高度由脚本按 docScrollHeight 动态设置（整页截图用） */
      iframe { width: 430px; height: 900px; border: 0; }
      /* 取数用的 <pre> 包在 0 尺寸 overflow:hidden 容器里：textContent 仍可读，但不参与渲染
         （负坐标 off-screen 会被 --screenshot 截进图里，vision 会误报成"调试条"假象） */
      #sink { position: absolute; top: 0; left: 0; width: 0; height: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- 430 宽 iframe 模拟小程序视口；只给 DOM 数字，不靠 vision 猜
         页面 5：/pages/detecting/index（检测进行中，page-5-2）
         两段测量：phase1（首次加载后）· phase2（跨过一次 5s 轮询后）→ 数字应一致 -->
    <iframe id="f" src="/index.html#/pages/detecting/index?jobId=j1"></iframe>
    <div id="sink"><pre id="m">pending</pre></div>
    <script>
      var f = document.getElementById('f')
      var acc = {}
      f.addEventListener('load', function () {
        setTimeout(function () { phase(1) }, 2500)
        setTimeout(function () { phase(2) }, 9500)
      })

      function collect(doc, win) {
        var over = []
        doc.querySelectorAll('*').forEach(function (el) {
          var r = el.getBoundingClientRect()
          if (r.width > 0 && r.right > win.innerWidth + 0.5) {
            over.push({ tag: el.tagName, cls: String(el.className || '').slice(0, 70), right: Math.round(r.right) })
          }
        })
        function rect(sel) {
          var el = doc.querySelector(sel)
          if (!el) return null
          var r = el.getBoundingClientRect()
          return { x: Math.round(r.x), top: Math.round(r.top), right: Math.round(r.right), bottom: Math.round(r.bottom), w: Math.round(r.width), h: Math.round(r.height) }
        }
        function texts(sel) {
          return Array.prototype.map.call(doc.querySelectorAll(sel), function (e) { return e.textContent.trim() })
        }
        function colors(sel) {
          return Array.prototype.map.call(doc.querySelectorAll(sel), function (e) { return win.getComputedStyle(e).backgroundColor })
        }
        function colorOf(sel, prop) {
          var el = doc.querySelector(sel)
          return el ? win.getComputedStyle(el)[prop] : null
        }
        var text = (doc.body && doc.body.innerText) || ''
        var need = [
          '检测进行中', '总进度', '58%', '已完成 7 / 12 个检测项', '预计剩余 42 分钟',
          '检测期间已启用成本保护', '本次检测由平台承担费用，不会计入你的账单',
          '分项检测',
          'D1 网络连通性', 'D2 鉴权有效性', 'D3 模型清单一致性', 'D4 上下文长度',
          'D5 稳定性与错误率', 'D6 计费口径核验', 'D7 合规与内容安全', 'D8 峰值并发压测',
          '已通过 · 236ms', '已通过 · 密钥有效', '进行中 · 2/2 模型已核验',
          '进行中 · 长文本压测中', '进行中 · 采样 30 / 100',
          '完成', '进行中', '排队中',
          '检测期间你可以先完善供应商档案，检测完成后会自动通知你，无需停留本页。',
          '查看历史检测报告'
        ]
        return {
          innerWidth: win.innerWidth,
          docScrollWidth: doc.documentElement.scrollWidth,
          docScrollHeight: Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight),
          overflowingCount: over.length,
          overflowing: over.slice(0, 20),
          missingTexts: need.filter(function (t) { return text.indexOf(t) === -1 }),
          rowCount: doc.querySelectorAll('[data-testid="probe-row"]').length,
          probeNames: texts('[data-testid="probe-name"]'),
          probeDetails: texts('[data-testid="probe-detail"]'),
          probeChips: texts('[data-testid="probe-chip"]'),
          rowClasses: Array.prototype.map.call(doc.querySelectorAll('[data-testid="probe-row"]'), function (e) { return String(e.className) }),
          chipLabels: texts('[data-testid="status-chip"]'),
          statusDotRect: rect('.chip__dot'),
          percentText: (function () { var e = doc.querySelector('[data-testid="total-percent"]'); return e ? e.textContent.trim() : null })(),
          fillWidthPct: (function () { var e = doc.querySelector('[data-testid="progress-fill"]'); return e ? e.style.width : null })(),
          finishedText: (function () { var e = doc.querySelector('[data-testid="progress-finished"]'); return e ? e.textContent.trim() : null })(),
          etaText: (function () { var e = doc.querySelector('[data-testid="eta-text"]'); return e ? e.textContent.trim() : null })(),
          topbar: rect('.detecting-page__topbar'),
          body: rect('.detecting-page__body'),
          totalCard: rect('.card'),
          bar: rect('.bar'),
          fill: rect('.bar__fill'),
          barBg: colorOf('.bar', 'backgroundColor'),
          fillBg: colorOf('.bar__fill', 'backgroundColor'),
          costBlock: rect('[data-testid="cost-block"]'),
          costBg: colorOf('[data-testid="cost-block"]', 'backgroundColor'),
          probeBox: rect('.probe-row__box'),
          probeBoxBgs: colors('.probe-row__box'),
          probeChipBg: colors('.probe-chip'),
          probeChipTextColors: Array.prototype.map.call(doc.querySelectorAll('.probe-chip__text'), function (e) { return win.getComputedStyle(e).color }),
          probeChipRect: rect('.probe-chip'),
          rowRects: Array.prototype.map.call(doc.querySelectorAll('[data-testid="probe-row"]'), function (e) {
            var r = e.getBoundingClientRect(); return { top: Math.round(r.top), h: Math.round(r.height) }
          }),
          tipCard: rect('[data-testid="tip-card"]'),
          tipBg: colorOf('[data-testid="tip-card"]', 'backgroundColor'),
          historyBar: rect('.history-bar'),
          historyBtn: rect('[data-testid="history-btn"]'),
          historyBtnBg: colorOf('[data-testid="history-btn"]', 'backgroundColor'),
          historyBtnText: (function () { var e = doc.querySelector('[data-testid="history-btn"]'); return e ? e.textContent.trim() : null })(),
          pageBg: colorOf('.detecting-page', 'backgroundColor'),
          topbarBg: colorOf('.detecting-page__topbar', 'backgroundColor'),
          userAgent: win.navigator.userAgent
        }
      }

      function phase(n) {
        try {
          var payload = collect(f.contentDocument, f.contentWindow)
          acc['phase' + n] = payload
          // 整页截图：把 iframe 高度设成文档高度（先看数字再截，避免折叠区被误判成"被裁掉"）
          if (n === 2) {
            f.style.height = payload.docScrollHeight + 'px'
            acc.iframeHeightForShot = payload.docScrollHeight
          }
          document.getElementById('m').textContent = 'MEASURE_JSON:' + JSON.stringify(acc)
        } catch (e) {
          document.getElementById('m').textContent = 'MEASURE_JSON:{"error":"' + e.message + '"}'
        }
      }
    </script>
  </body>
</html>
