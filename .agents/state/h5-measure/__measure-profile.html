    <script>
      var f = document.getElementById('f')
      var acc = {}
      var reloadSeq = 0
      var SCENARIO = (location.search.match(/scenario=([a-z]+)/) || [])[1] || ''
      var SHOT_ONLY = location.search.indexOf('shot') !== -1
      var NO_ACTION = location.search.indexOf('noaction') !== -1
      if (SHOT_ONLY) f.style.height = '1414px' /* = 设计帧高 */

      /* 选择器语法：`sel@@N` = 该选择器的第 N 个匹配（也接受 CSS 里非法的 `sel#N` 写法，先归一化成 @@N）。
         `A@@N B` = 在第 N 个 A 里查 B。 */
      function splitSel(sel) {
        var s = String(sel).replace(/#(\d+)(?=\s|$)/g, '@@$1')
        var i = s.indexOf('@@')
        if (i === -1) return { base: s, n: 0, tail: '' }
        var head = s.slice(0, i)
        var rest = s.slice(i + 2).split(/\s+/)
        return { base: head.trim(), n: Number(rest[0]), tail: rest.slice(1).join(' ') }
      }

      function collect(doc, win, withChecks) {
        var fails = []
        var checks = 0

        function norm(v) {
          if (typeof v === 'number') return v
          var s = String(v == null ? '' : v).trim()
          if (/^-?\d+(\.\d+)?px$/.test(s)) return Number(s.replace('px', ''))
          return s
        }
        function normColor(s) {
          var m = String(s || '').match(/rgba?\(([^)]+)\)/)
          if (!m) return String(s || '')
          var p = m[1].split(',').map(function (t) { return Number(t.trim()) })
          var a = p.length > 3 ? p[3] : 1
          return a === 1 ? 'rgb(' + p[0] + ', ' + p[1] + ', ' + p[2] + ')' : 'rgba(' + p.join(', ') + ')'
        }
        /* box-shadow 的颜色归一化，但偏移/模糊/扩散必须保留 */
        function normShadow(s) {
          return String(s == null ? '' : s).replace(/rgba?\([^)]+\)/g, function (m) { return normColor(m) })
        }
        function declared(sel, prop) {
          /* CSSOM 声明值（非 used 值）：0.8px 描边/1px ring 的 computed 会被取整，判声明值更准 */
          var sp = splitSel(sel)
          if (!el(sel)) return null
          for (var i = 0; i < doc.styleSheets.length; i++) {
            var rules
            try { rules = doc.styleSheets[i].cssRules } catch (e) { continue }
            for (var j = 0; j < rules.length; j++) {
              var r = rules[j]
              if (!r.selectorText || r.selectorText.indexOf('[') === 0) continue
              var sels = r.selectorText.split(',').map(function (s) { return s.trim().replace(/\[data-v-[^\]]+\]/g, '') })
              if (sels.indexOf(sp.base) === -1) continue
              var v = r.style && r.style[prop]
              if (v) return v
            }
          }
          return null
        }
        function el(sel) {
          var sp = splitSel(sel)
          if (!sp.n && !sp.tail) return doc.querySelector(sp.base)
          var roots = doc.querySelectorAll(sp.base)
          var root = roots[sp.n]
          if (!root) return null
          return sp.tail ? root.querySelector(sp.tail) : root
        }
        function rect(sel) {
          var e = el(sel)
          if (!e) return null
          var r = e.getBoundingClientRect()
          return {
            x: Math.round(r.x), top: Math.round(r.top), right: Math.round(r.right),
            bottom: Math.round(r.bottom), w: Math.round(r.width), h: Math.round(r.height)
          }
        }
        /* 组感知解析：`A@@N` → 第 N 个 A 自身；`A@@N B` → 第 N 个 A 内的全部 B；纯选择器 → 全部匹配。
           （这些 list 助手必须用它，否则 `A@@N B` 会被当成「全部 A 的文本」——探针自身口径错误） */
        function resolveAll(sel) {
          var sp = splitSel(sel)
          if (!sp.n && !sp.tail) return Array.prototype.slice.call(doc.querySelectorAll(sp.base))
          var roots = doc.querySelectorAll(sp.base)
          var root = roots[sp.n]
          if (!root) return []
          if (!sp.tail) return [root]
          return Array.prototype.slice.call(root.querySelectorAll(sp.tail))
        }
        function rects(sel) {
          return resolveAll(sel).map(function (e) {
            var r = e.getBoundingClientRect()
            return { x: Math.round(r.x), top: Math.round(r.top), right: Math.round(r.right), bottom: Math.round(r.bottom), w: Math.round(r.width), h: Math.round(r.height) }
          })
        }
        function css(sel, prop) {
          var e = el(sel)
          if (!e) return null
          var v = win.getComputedStyle(e)[prop]
          if (prop === 'boxShadow') return normShadow(v)
          return prop.toLowerCase().indexOf('color') >= 0 ? normColor(v) : norm(v)
        }
        function chk(key, got, want, tol) {
          if (!withChecks) return got
          checks++
          var t = tol == null ? 0 : tol
          var g = norm(got)
          var w = norm(want)
          var gn = typeof g === 'number' ? g : (typeof g === 'string' && /^-?\d+(\.\d+)?$/.test(g) ? Number(g) : null)
          var wn = typeof w === 'number' ? w : (typeof w === 'string' && /^-?\d+(\.\d+)?$/.test(w) ? Number(w) : null)
          var ok
          if (gn !== null && wn !== null) ok = Math.abs(gn - wn) <= t
          else ok = g === w
          if (!ok) fails.push({ k: key, got: got, want: want })
          return got
        }
        /* chkR 的字段由 key 末段决定：.h/.w/.x/.left/.right/.top/.bottom */
        function rectField(sel, key) {
          var r = rect(sel)
          if (!r) return null
          var f = String(key).split('.').pop()
          if (f === 'x' || f === 'left') return r.x
          if (f === 'right') return r.right
          if (f === 'top') return r.top
          if (f === 'bottom') return r.bottom
          if (f === 'w' || f === 'width') return r.w
          if (f === 'h' || f === 'height') return r.h
          return r
        }
        function chkR(key, sel, want, tol) { return chk(key, rectField(sel, key), want, tol) }
        function chkC(key, sel, prop, want, tol) { return chk(key, css(sel, prop), want, tol) }
        /* 数值数组逐项比较（设计帧小数坐标链取整后会有 ±1..2 差） */
        function chkList(key, got, want, tol) {
          if (!withChecks) return got
          checks++
          var t = tol == null ? 0 : tol
          var ok = got.length === want.length
          if (ok) {
            for (var i = 0; i < got.length; i++) {
              if (got[i] == null || Math.abs(got[i] - want[i]) > t) { ok = false; break }
            }
          }
          if (!ok) fails.push({ k: key, got: got.join(','), want: want.join(',') })
          return got
        }
        function texts(sel) {
          return resolveAll(sel).map(function (e) { return e.textContent.trim() })
        }
        function colors(sel) {
          return resolveAll(sel).map(function (e) { return normColor(win.getComputedStyle(e).backgroundColor) })
        }
        function textOf(sel) {
          var e = el(sel)
          return e ? e.textContent.trim() : null
        }
        function groupOf(sel, groupSel) {
          return Array.prototype.map.call(doc.querySelectorAll(groupSel), function (g) { return g.querySelector(sel) })
        }
        function grpCss(groupSel, sel, prop) {
          return groupOf(sel, groupSel).map(function (e) {
            if (!e) return null
            var v = win.getComputedStyle(e)[prop]
            if (prop === 'boxShadow') return normShadow(v)
            return prop.toLowerCase().indexOf('color') >= 0 ? normColor(v) : norm(v)
          })
        }
        function grpRects(groupSel, sel) {
          return groupOf(sel, groupSel).map(function (e) {
            if (!e) return null
            var r = e.getBoundingClientRect()
            return { x: Math.round(r.x), top: Math.round(r.top), right: Math.round(r.right), bottom: Math.round(r.bottom), w: Math.round(r.width), h: Math.round(r.height) }
          })
        }
        function grpField(groupSel, sel, field) {
          return grpRects(groupSel, sel).map(function (r) {
            if (!r) return null
            var f = String(field).split('.').pop()
            if (f === 'x' || f === 'left') return r.x
            if (f === 'right') return r.right
            if (f === 'top') return r.top
            if (f === 'bottom') return r.bottom
            if (f === 'w' || f === 'width') return r.w
            if (f === 'h' || f === 'height') return r.h
            return null
          })
        }
        function textColors(sel) {
          return resolveAll(sel).map(function (e) { return normColor(win.getComputedStyle(e).color) })
        }

          gate: rect('.gate'),
          gateText: textOf('[data-testid="gate-hint"]'),
          lockBadge: rect('[data-testid="lock-badge"]'),
          lockBadgeText: textOf('[data-testid="lock-badge"]'),
          labels: texts('[data-testid="field-label"]'),
          typeChip: rect('.type-chip'),
          note: rect('.note'),
          noteText: textOf('[data-testid="note-basic"]'),
          twoCols: rects('.card@@2 .two-col'),
          introBox: rect('.intro-box'),
          introText: textOf('[data-testid="v-intro"]'),
          qualRows: rects(QUAL),
          qualThumbs: rects('.qual-row__thumb'),
          qualNames: texts('[data-testid="qual-name"]'),
          qualBadges: texts('[data-testid="qual-badge"]'),
          qualBadgeRects: rects('[data-testid="qual-badge"]'),
          qualBadgeBg: colors('[data-testid="qual-badge"]'),
          qualChevron: rect('[data-testid="qual-chevron"]'),
          uploadBtn: rect('[data-testid="btn-upload"]'),
          bar: rect('.bar'),
          saveBtn: rect('[data-testid="btn-save"]'),
          completeBtn: rect('[data-testid="btn-complete"]'),
          missingTexts: missing,
          userAgent: win.navigator.userAgent
        }
      }

      function sink(n, payload) {
        acc['phase' + n] = payload
        document.getElementById('m').textContent = 'MEASURE_JSON:' + JSON.stringify(acc)
      }

      function phase(n) {
        try {
          var payload = collect(f.contentDocument, f.contentWindow, n === 1)
          if (n === 1 && !SHOT_ONLY) {
            f.style.height = '900px' /* 保持取数高度：min-height:100vh 会把测量高度顶到 iframe 高 */
            acc.iframeHeightForShot = payload.docScrollHeight
          }
          sink(n, payload)
        } catch (e) {
          sink(n, { error: String(e && e.message) })
        }
      }

      function clickIn(sel) {
        var doc = f.contentDocument
        var el = doc.querySelector(sel)
        if (!el) return 'NOT_FOUND'
        var ev = doc.createEvent('MouseEvents')
        ev.initMouseEvent('click', true, true, f.contentWindow, 0, 0, 0, 0, 0, false, false, false, false, 0, null)
        el.dispatchEvent(ev)
        return 'CLICKED'
      }

      function toastText(doc) {
        var el = doc.querySelector('uni-toast .uni-toast__content, .uni-toast__content, uni-toast')
        return el ? el.textContent.trim() : ''
      }

      function hashNow() {
        try { return String(f.contentWindow.location.hash) } catch (e) { return 'ERR:' + e.message }
      }

      /** 载体页侧读文本（collect() 里的 textOf 是那个作用域内的，这里补一个顶层版本） */
      function textIn(sel) {
        try {
          var e = f.contentDocument.querySelector(sel)
          return e ? e.textContent.trim() : null
        } catch (err) { return 'ERR:' + err.message }
      }

      /** 轮询等待页面渲染出目标元素（uni H5 路由是异步的，固定 sleep 会踩空） */
      function waitFor(sel, maxTries) {
        return new Promise(function (resolve) {
          var n = 0
          function tick() {
            n++
            var ok = false
            try { ok = !!f.contentDocument.querySelector(sel) } catch (e) { ok = false }
            if (ok) return resolve('READY(tries=' + n + ')')
            if (n >= (maxTries || 40)) return resolve('TIMEOUT(tries=' + n + ')')
            setTimeout(tick, 200)
          }
          tick()
        })
      }

      function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms) }) }

      function reload() {
        return new Promise(function (resolve) {
          reloadSeq += 1
          f.onload = function () { f.onload = null; resolve('LOADED') }
          f.src = '/index.html?r=' + reloadSeq + '#/pages/profile/index'
        })
      }

      /** 回放单个控件：reload → 等就绪 → 点 → 延迟读 hash/toast */
      function replay(testid, delay) {
        var sel = '[data-testid="' + testid + '"]'
        return reload()
          .then(function () { return waitFor(sel) })
          .then(function (ready) {
            var clicked = clickIn(sel)
            return sleep(delay || 900).then(function () {
              return { ready: ready, clicked: clicked, hashAfter: hashNow(), toastAfter: toastText(f.contentDocument) }
            })
          })
      }

      async function main() {
        try {
          await waitFor('[data-testid="page-title"]')
          await sleep(1400)
          phase(1)
          if (NO_ACTION) return

          /* phase2：点「保存」→ 真实 PUT /api/v1/provider/profile（serve 日志核对）→ toast + 完整度刷新 */
          await sleep(600)
          var saveClicked = clickIn('[data-testid="btn-save"]')
          await sleep(1500)
          sink(2, {
            clickedSave: saveClicked,
            toastAfterSave: toastText(f.contentDocument),
            pillAfterSave: textIn('[data-testid="completeness-pill"]'),
            percentAfterSave: textIn('[data-testid="completeness-percent"]'),
            barStyleAfterSave: (function () {
              var el = f.contentDocument.querySelector('[data-testid="completeness-bar"]')
              return el ? el.getAttribute('style') : null
            })(),
            hash: hashNow()
          })

          /* phase3：四个跳转入口逐个回放（每次 reload，避免一次 navigateTo 之后页面已卸载） */
          var out = {}
          out.edit = await replay('action-edit')
          out.manage = await replay('action-manage')
          out.upload = await replay('btn-upload')
          out.complete = await replay('btn-complete')
          sink(3, out)

          /* phase4：返回箭头 → navigateBack */
          sink(4, await replay('back-btn'))
        } catch (e) {
          sink('error', { message: String(e && e.message), stack: String((e && e.stack) || '').slice(0, 500) })
        }
      }

      main()
    </script>
  </body>
</html>
