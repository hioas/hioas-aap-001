  <body>
    <!-- 430 宽 iframe 模拟小程序视口；数字优先，不靠 vision 猜
         序号 12-v1：/pages/quote-form/index（帧名「新增报价单-初始态」，page-26 ·
         layer_id e9214640-519e-4671-a23e-ac03e92add54）
         设计帧重抓 2026-09-16 14:0x：design.json sha256 2e8d879b…，与实现所依据的一份**逐字节相同**（无漂移）
         want 口径（两类来源）：
           ① 声明值 = .calicat/raw/pages/page-26/design.tree.json（node-by-id.py / text-lineheight.py 逐节点读）
           ② fit_content 真实尺寸 = 设计 PNG（.agents/state/design-shots/page-26.png，430×1238）像素实测：
              png-rows / scan-col / png-textbands / png-profile / png-colorat
              实测锚点：顶栏 0..101(102) · 步骤卡 118..183(65) · 卡1 199..624(425) · 卡2 640..927(287)
                       卡3 943..1099(156) · 底栏 1120.5..1238(117.5) · 页高 1238
                       名称输入框 top 276 · 字数提示 330..343.2(13.2) · 分隔线 362/493 · 单号只读框 404..452
                       凭证选择框 536..584 · 空态盒 692..856.4(164.4) · 提示卡 868.5..911(42.5, 设计一行)
                       须知条目 995/1021/1047（条目3 两行 36）· 保存按钮 1162..1210
              icon 行盒 = 字号 × 1.5（本页三处交叉验证：底栏 13→19.5 使底栏高恰为 117.5、卡3 标题 16→24 使卡3 恰为 156、
              提示卡 15→22.5 使卡高 42.5）；文本行盒 = 字号 × 1.2（空态说明 12→14.4 使空态盒 164.4）
              —— 例外：须知条目文案 12px 在设计稿里渲染成 18 行盒（PNG 行距实测 1052/1067 两行），按实测落地
         phase1 = 首屏（空态，零请求）→ 设计期望值 checks 全量
         ?scenario=actions → phase2（点凭证选择框 → GET /api/v1/credentials → 选 c1 → GET /api/v1/credentials/c1 带出模型）
           · phase3（填名称 → 保存并继续 → 真实 POST /api/v1/quotes + POST /api/v1/quotes/q9/items → toast + 跳模型定价页）
         ?noaction=1 → 只跑 phase1（纯测量轮）· ?shot=1 → iframe 高 = 设计帧高 1238（截图用，不跳页） -->
    <iframe id="f" src="/index.html#/pages/quote-form/index"></iframe>
    <div id="sink"><pre id="m">pending</pre></div>
    <script>
      var f = document.getElementById('f')
      var acc = {}
      var SCENARIO = (location.search.match(/scenario=([a-z-]+)/) || [])[1] || ''
      var SHOT_ONLY = location.search.indexOf('shot') !== -1
      var NO_ACTION = location.search.indexOf('noaction') !== -1
      if (SHOT_ONLY) f.style.height = '1238px' /* = 设计帧高 */

      /* 选择器语法：`sel@@N` = 该选择器的第 N 个匹配（也接受 CSS 里非法的 `sel#N` 写法，先归一化成 @@N）。
         `A@@N B` = 在第 N 个 A 里查 B。 */
      function splitSel(sel) {
        var s = String(sel).replace(/#(\d+)(?=\s|$)/g, '@@$1')
        var i = s.indexOf('@@')
        if (i === -1) return { base: s, n: 0, tail: '' }
        var head = s.slice(0, i)
        var rest = s.slice(i + 2).split(/\s+/)
        return { base: head.trim(), n: Number(rest[0]), tail: rest.slice(1).join(' ') }
      }

      function collect(doc, win, withChecks) {
        var fails = []
        var checks = 0

        function norm(v) {
          if (typeof v === 'number') return v
          var s = String(v == null ? '' : v).trim()
          if (/^-?\d+(\.\d+)?px$/.test(s)) return Number(s.replace('px', ''))
          return s
        }
        function normColor(s) {
          var m = String(s || '').match(/rgba?\(([^)]+)\)/)
          if (!m) return String(s || '')
          var p = m[1].split(',').map(function (t) { return Number(t.trim()) })
          var a = p.length > 3 ? p[3] : 1
          return a === 1 ? 'rgb(' + p[0] + ', ' + p[1] + ', ' + p[2] + ')' : 'rgba(' + p.join(', ') + ')'
        }
        function normShadow(s) {
          return String(s == null ? '' : s).replace(/rgba?\([^)]+\)/g, function (m) { return normColor(m) })
        }
        function el(sel) {
          var sp = splitSel(sel)
          if (!sp.n && !sp.tail) return doc.querySelector(sp.base)
          var roots = doc.querySelectorAll(sp.base)
          var root = roots[sp.n]
          if (!root) return null
          return sp.tail ? root.querySelector(sp.tail) : root
        }
        function resolveAll(sel) {
          var sp = splitSel(sel)
          if (!sp.n && !sp.tail) return Array.prototype.slice.call(doc.querySelectorAll(sp.base))
          var roots = doc.querySelectorAll(sp.base)
          var root = roots[sp.n]
          if (!root) return []
          if (!sp.tail) return [root]
          return Array.prototype.slice.call(root.querySelectorAll(sp.tail))
        }
        function rect(sel) {
          var e = el(sel)
          if (!e) return null
          var r = e.getBoundingClientRect()
          return {
            x: Math.round(r.x), top: Math.round(r.top), right: Math.round(r.right),
            bottom: Math.round(r.bottom), w: Math.round(r.width), h: Math.round(r.height)
          }
        }
        function rects(sel) {
          return resolveAll(sel).map(function (e) {
            var r = e.getBoundingClientRect()
            return { x: Math.round(r.x), top: Math.round(r.top), right: Math.round(r.right), bottom: Math.round(r.bottom), w: Math.round(r.width), h: Math.round(r.height) }
          })
        }
        function css(sel, prop) {
          var e = el(sel)
          if (!e) return null
          var v = win.getComputedStyle(e)[prop]
          if (prop === 'boxShadow') return normShadow(v)
          return prop.toLowerCase().indexOf('color') >= 0 ? normColor(v) : norm(v)
        }
        function declared(sel, prop) {
          var sp = splitSel(sel)
          if (!el(sel)) return null
          for (var i = 0; i < doc.styleSheets.length; i++) {
            var rules
            try { rules = doc.styleSheets[i].cssRules } catch (e) { continue }
            for (var j = 0; j < rules.length; j++) {
              var r = rules[j]
              if (!r.selectorText || r.selectorText.indexOf('[') === 0) continue
              var sels = r.selectorText.split(',').map(function (s) { return s.trim().replace(/\[data-v-[^\]]+\]/g, '') })
              if (sels.indexOf(sp.base) === -1) continue
              var v = r.style && r.style[prop]
              if (v) return v
            }
          }
          return null
        }
        function chk(key, got, want, tol) {
          if (!withChecks) return got
          checks++
          var t = tol == null ? 0 : tol
          var g = norm(got)
          var w = norm(want)
          var gn = typeof g === 'number' ? g : (typeof g === 'string' && /^-?\d+(\.\d+)?$/.test(g) ? Number(g) : null)
          var wn = typeof w === 'number' ? w : (typeof w === 'string' && /^-?\d+(\.\d+)?$/.test(w) ? Number(w) : null)
          var ok
          if (gn !== null && wn !== null) ok = Math.abs(gn - wn) <= t
          else ok = g === w
          if (!ok) fails.push({ k: key, got: got, want: want })
          return got
        }
        function rectField(sel, key) {
          var r = rect(sel)
          if (!r) return null
          var f = String(key).split('.').pop()
          if (f === 'x' || f === 'left') return r.x
          if (f === 'right') return r.right
          if (f === 'top') return r.top
          if (f === 'bottom') return r.bottom
          if (f === 'w' || f === 'width') return r.w
          if (f === 'h' || f === 'height') return r.h
          return r
        }
        function chkR(key, sel, want, tol) { return chk(key, rectField(sel, key), want, tol) }
        function chkC(key, sel, prop, want, tol) { return chk(key, css(sel, prop), want, tol) }
        function chkD(key, sel, prop, want) { return chk(key, declared(sel, prop), want) }
        /* 数值数组逐项比较（设计帧小数坐标链取整后会有 ±1..2 差） */
        function chkList(key, got, want, tol) {
          if (!withChecks) return got
          checks++
          var t = tol == null ? 0 : tol
          var ok = got.length === want.length
          if (ok) {
            for (var i = 0; i < got.length; i++) {
              if (got[i] == null || Math.abs(got[i] - want[i]) > t) { ok = false; break }
            }
          }
          if (!ok) fails.push({ k: key, got: got.join(','), want: want.join(',') })
          return got
        }
        /* 字符串数组逐项比较（chkList 只做数值比较，字符串会被静默放过） */
        function chkStrs(key, got, want) {
          if (!withChecks) return got
          checks++
          var ok = got.length === want.length
          if (ok) {
            for (var i = 0; i < got.length; i++) {
              if (String(got[i]) !== String(want[i])) { ok = false; break }
            }
          }
          if (!ok) fails.push({ k: key, got: got.join(' | '), want: want.join(' | ') })
          return got
        }
        function texts(sel) { return resolveAll(sel).map(function (e) { return e.textContent.trim() }) }
        function textOf(sel) { var e = el(sel); return e ? e.textContent.trim() : null }
        function colors(sel) { return resolveAll(sel).map(function (e) { return normColor(win.getComputedStyle(e).backgroundColor) }) }
        function textColors(sel) { return resolveAll(sel).map(function (e) { return normColor(win.getComputedStyle(e).color) }) }
        function byTestId(id) { return doc.querySelector('[data-testid="' + id + '"]') }

        var CARDS = '.card'
        /* 设计树里每一个独立文本图层（文案完整性检查清单，逐字抄自 design.tree.json；图标字形层 content 为空不进清单） */
        var NEED_TEXT = [
          '新增报价单', '填写基本信息并设置模型报价',
          '填写信息', '名称 / 密钥 / 单号', '设置报价', '模型定价', '1', '2',
          '基本信息', '为必填项',
          '报价单名称', '*', '请输入报价单名称，如：2024Q3 主线路报价', '0/30',
          '报价单号', '系统生成', '保存后自动生成', 'QT-XXXXXXXX-XXXX',
          '报价单号由系统按日期与序号规则自动生成，无需手动填写',
          '凭证名称', '请选择凭证', '选择凭证后，系统将自动带出该凭证下可用的模型列表',
          '模型列表', '待带出', '尚未加载模型', '请先在上方选择凭证，系统将自动带出可用模型列表',
          '带出的模型数量与凭证权限相关，可在「我的设置」中管理凭证权限范围。',
          '填写须知',
          '报价单名称建议包含季度或用途，便于后续在列表中检索。',
          '凭证决定可报价的模型范围，选择后模型列表自动刷新。',
          '首次保存成功后，系统将自动生成报价单号并进入设置报价环节。',
          '保存成功后系统将自动生成报价单号', '存为草稿', '保存并继续'
        ]

        /* ============ 溢出（uni-app 内置测量元素不计入，见 uni-app 技能 §3 口径） ============ */
        var over = []
        Array.prototype.slice.call(doc.querySelectorAll('*')).forEach(function (e) {
          var r = e.getBoundingClientRect()
          if (r.width <= 0 || r.right <= win.innerWidth + 0.5) return
          if (e.closest && e.closest('uni-resize-sensor')) return
          if (String(e.tagName).toLowerCase() === 'uni-resize-sensor') return
          over.push({ tag: e.tagName, cls: String(e.className || '').slice(0, 70), left: Math.round(r.x), w: Math.round(r.width), right: Math.round(r.right) })
        })
        var bodyText = (doc.body && doc.body.innerText) || ''
        var missing = NEED_TEXT.filter(function (t) { return bodyText.indexOf(t) === -1 })

        /* ===================== 整页（设计帧 430×1238） ===================== */
        var docH = Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight)
        chk('page.innerWidth', win.innerWidth, 430)
        chk('page.docScrollWidth', doc.documentElement.scrollWidth, 430)
        chk('page.docHeight', docH, 1238, 4) /* 设计帧高 1238；实测 +3 全部来自提示卡文案 CJK 换行（见下 card2 注释） */
        chk('page.overflowingCount', over.length, 0)
        chk('page.missingTextCount', missing.length, 0)
        chkC('page.bg', '.qf', 'backgroundColor', 'rgb(245, 247, 251)') /* design 页面容器 ac646f45 fills rgba(245,247,251,1) */
        chk('page.cardCount', doc.querySelectorAll(CARDS).length, 3)
        chk('page.stepCardCount', doc.querySelectorAll('.step-card').length, 1)
        chk('page.tabbarAbsent', !!doc.querySelector('.tabbar'), false)
        /* PNG 实测：步骤卡 118..183 · 卡1 199..624.5 · 卡2 640..927.5 · 卡3 943..1099
           卡2 的 want 291 = 设计 287.5 + 3.9（提示卡文案在设计稿里是一行、浏览器 CJK 必然两行 → 盒 46 vs 42.5，见 designLiteralDiff） */
        chkR('stepCard.top', '.step-card', 118, 2)
        chkR('stepCard.h', '.step-card', 65, 2)
        chkList('page.cardTops', rects(CARDS).map(function (r) { return r.top }), [199, 640, 943], 4)
        chkList('page.cardHeights', rects(CARDS).map(function (r) { return r.h }), [425, 291, 156], 2)
        /* 卡间距 / 卡3 到操作条 = 设计声明值（不受累计取整影响，容差 1） */
        chk('page.gap12', rect(CARDS + '@@1').top - rect(CARDS + '@@0').bottom, 16, 1)
        chk('page.gap23', rect(CARDS + '@@2').top - rect(CARDS + '@@1').bottom, 16, 1)
        chk('page.gapToBar', rect('.qf__bar').top - rect(CARDS + '@@2').bottom, 20, 1)
        chkList('page.cardX', rects(CARDS).map(function (r) { return r.x }), [16, 16, 16], 1)
        chkList('page.cardW', rects(CARDS).map(function (r) { return r.w }), [398, 398, 398], 1)
        chkC('page.cardPad', '.card@@0', 'padding', '16px')
        chkC('page.cardRadius', '.card@@0', 'borderRadius', '16px')
        chkC('page.cardBg', '.card@@0', 'backgroundColor', 'rgb(255, 255, 255)')
        /* design effects：步骤卡 7acff570(0,4,16,.05) · 基本信息卡 82bbea2b(0,4,16,.06) ·
           模型列表卡 9fabffe3(0,4,16,.06) · 填写须知卡 f4fab5a4(0,4,16,.05) · 底栏 0bf8e01d(0,-4,16,.05) */
        chkC('page.stepShadow', '.step-card', 'boxShadow', 'rgba(15, 23, 42, 0.05) 0px 4px 16px 0px')
        chkC('page.card1Shadow', '.card@@0', 'boxShadow', 'rgba(15, 23, 42, 0.06) 0px 4px 16px 0px')
        chkC('page.card2Shadow', '.card@@1', 'boxShadow', 'rgba(15, 23, 42, 0.06) 0px 4px 16px 0px')
        chkC('page.card3Shadow', '.card@@2', 'boxShadow', 'rgba(15, 23, 42, 0.05) 0px 4px 16px 0px')

        /* ===================== 顶部导航（design c36637be padding[48,16,12,16]） ===================== */
        chkR('nav.h', '.qf__nav', 102, 1) /* 48 + 标题块(24+18=42) + 12 */
        chkC('nav.pad', '.qf__nav', 'padding', '48px 16px 12px')
        chkC('nav.bg', '.qf__nav', 'backgroundColor', 'rgb(255, 255, 255)')
        chkR('nav.back.x', '.nav__back', 16, 1)
        chkR('nav.back.top', '.nav__back', 51, 2) /* 顶部左侧 alignItems=center：48 + (42-36)/2 = 51（设计 PNG 实测圆 51..87） */
        chkR('nav.back.w', '.nav__back', 36, 1)
        chkR('nav.back.h', '.nav__back', 36, 1)
        chkC('nav.back.radius', '.nav__back', 'borderRadius', '18px')
        chkC('nav.back.bg', '.nav__back', 'backgroundColor', 'rgb(241, 245, 249)')
        /* 返回字形 图层 0848e539 fs18 w20 → 盒 20×27（1.5 行盒） */
        chkR('nav.backIcon.w', '.ic-back', 20, 1)
        chkR('nav.backIcon.h', '.ic-back', 27, 1)
        /* 顶部左侧 gap12 → 标题块 x = 16+36+12 = 64；标题 图层 03388cf8 fs18 Bold #0F172A h24 */
        chkR('nav.title.x', '.nav__title', 64, 1)
        chkC('nav.title.fs', '.nav__title', 'fontSize', 18)
        chkC('nav.title.fw', '.nav__title', 'fontWeight', 700)
        chkC('nav.title.lh', '.nav__title', 'lineHeight', 24)
        chkC('nav.title.color', '.nav__title', 'color', 'rgb(15, 23, 42)')
        chkStrs('nav.title.text', [textOf('.nav__title')], ['新增报价单'])
        /* 副标题 图层 e5875426 fs12 #94A3B8 h18 */
        chkC('nav.sub.fs', '.nav__subtitle', 'fontSize', 12)
        chkC('nav.sub.fw', '.nav__subtitle', 'fontWeight', 400)
        chkC('nav.sub.lh', '.nav__subtitle', 'lineHeight', 18)
        chkC('nav.sub.color', '.nav__subtitle', 'color', 'rgb(148, 163, 184)')
        chkStrs('nav.sub.text', [textOf('.nav__subtitle')], ['填写基本信息并设置模型报价'])
        chkR('nav.help.right', '.nav__help', 414, 1)
        chkR('nav.help.w', '.nav__help', 36, 1)
        chkR('nav.help.h', '.nav__help', 36, 1)
        chkC('nav.help.radius', '.nav__help', 'borderRadius', '18px')
        chkC('nav.help.bg', '.nav__help', 'backgroundColor', 'rgb(241, 245, 249)')
        chkR('nav.helpIcon.w', '.ic-help', 20, 1) /* 图层 f85b3b09 fs18 w20 */
        chkR('nav.helpIcon.h', '.ic-help', 27, 1)

        /* ===================== 步骤卡（design 7acff570 padding16 r16） ===================== */
        chkC('step.pad', '.step-card', 'padding', '16px')
        chkC('step.radius', '.step-card', 'borderRadius', '16px')
        chkC('step.bg', '.step-card', 'backgroundColor', 'rgb(255, 255, 255)')
        chkList('step.dots', rects('.step__dot').map(function (r) { return r.w }), [26, 26], 1)
        chkList('step.dotHs', rects('.step__dot').map(function (r) { return r.h }), [26, 26], 1)
        chkC('step.dot.radius', '.step__dot@@0', 'borderRadius', '13px')
        chkC('step.dot.bgOn', '.step__dot@@0', 'backgroundColor', 'rgb(37, 99, 235)') /* 步骤1圆点 216f18be #2563EB */
        chkC('step.dot.bgOff', '.step__dot@@1', 'backgroundColor', 'rgb(241, 245, 249)') /* 步骤2圆点 448fe0e9 #F1F5F9 */
        chkStrs('step.nos', texts('.step__no'), ['1', '2'])
        chkC('step.no.fs', '.step__no@@0', 'fontSize', 12)
        chkC('step.no.fw', '.step__no@@0', 'fontWeight', 700)
        chkC('step.no.lh', '.step__no@@0', 'lineHeight', 18)
        chkC('step.no.colorOn', '.step__no@@0', 'color', 'rgb(255, 255, 255)') /* ba2be698 白字 */
        chkC('step.no.colorOff', '.step__no@@1', 'color', 'rgb(148, 163, 184)') /* f47952e8 #94A3B8 */
        chkStrs('step.titles', texts('.step__title'), ['填写信息', '设置报价'])
        chkC('step.title.fs', '.step__title@@0', 'fontSize', 13)
        chkC('step.title.fw', '.step__title@@0', 'fontWeight', 600)
        chkC('step.title.lh', '.step__title@@0', 'lineHeight', 18)
        chkC('step.title.colorOn', '.step__title@@0', 'color', 'rgb(15, 23, 42)') /* 8a98e2cf #0F172A */
        chkC('step.title.colorOff', '.step__title@@1', 'color', 'rgb(148, 163, 184)') /* 56ced044 #94A3B8 */
        chkStrs('step.descs', texts('.step__desc'), ['名称 / 密钥 / 单号', '模型定价'])
        chkC('step.desc.fs', '.step__desc@@0', 'fontSize', 11)
        chkC('step.desc.lh', '.step__desc@@0', 'lineHeight', 15) /* 图层 7c835e6a h15 */
        chkC('step.desc.colorOn', '.step__desc@@0', 'color', 'rgb(148, 163, 184)')
        chkC('step.desc.colorOff', '.step__desc@@1', 'color', 'rgb(203, 213, 225)') /* 3eb8ce8f #CBD5E1 */
        chkR('step.line.h', '.step-line', 2, 1)
        chkC('step.line.bg', '.step-line', 'backgroundColor', 'rgb(226, 232, 240)')

        /* ===================== 基本信息卡 · 标题行（design 7cc9c0fe） ===================== */
        chkList('basic.head.h', rects('.card__head').map(function (r) { return r.h }), [20, 20, 24], 1)
        chkR('basic.bar.w', '.card__bar', 5, 1) /* 标题竖条 803a0d01 w5 h16 r2 #2563EB */
        chkR('basic.bar.h', '.card__bar', 16, 1)
        chkC('basic.bar.radius', '.card__bar', 'borderRadius', '2px')
        chkC('basic.bar.bg', '.card__bar', 'backgroundColor', 'rgb(37, 99, 235)')
        chkList('basic.headGap', [css('.card__head@@0', 'columnGap')], [8], 0) /* 卡片标题行 gap 8 */

            key: rect('.ic-key'), chevron: rect('.ic-chevron'), empty: rect('.ic-empty'),
            tip: rect('.ic-tip'), notice: rect('.ic-notice'), saveInfo: rect('.ic-save-info'), save: rect('.ic-save')
          },
          texts: {
            navTitle: textOf('.nav__title'), navSub: textOf('.nav__subtitle'),
            steps: texts('.step__title'), placeholder: textOf('.input-box__placeholder'),
            counter: textOf('.counter__text'), quoteNo: textOf('.readonly-box__text'),
            credValue: textOf('.select__value'), chip: textOf('[data-testid="chip-model"] .tag__text'),
            emptyTitle: textOf('.empty__title'), emptyDesc: textOf('.empty__desc'),
            tip: textOf('.tip__text'), notices: texts('.notice__text'),
            barHint: textOf('.bar__hint-text'), draft: textOf('.btn--ghost'), save: textOf('.btn__text')
          },
          userAgent: win.navigator.userAgent
        }
      }

      function sink(n, payload) {
        acc['phase' + n] = payload
        document.getElementById('m').textContent = 'MEASURE_JSON:' + JSON.stringify(acc)
      }

      function phase(n) {
        try {
          var payload = collect(f.contentDocument, f.contentWindow, n === 1)
          if (n === 1 && !SHOT_ONLY) {
            f.style.height = '900px' /* 保持取数高度：min-height:100vh 会把测量高度顶到 iframe 高 */
            acc.iframeHeightForShot = payload.docScrollHeight
          }
          sink(n, payload)
        } catch (e) {
          sink(n, { error: String(e && e.message) })
        }
      }

      function clickIn(sel) {
        var doc = f.contentDocument
        var el = doc.querySelector(sel)
        if (!el) return 'NOT_FOUND'
        var ev = doc.createEvent('MouseEvents')
        ev.initMouseEvent('click', true, true, f.contentWindow, 0, 0, 0, 0, 0, false, false, false, false, 0, null)
        el.dispatchEvent(ev)
        return 'CLICKED'
      }

      /** uni-app H5 的 <input> 渲染成 <uni-input> 宿主 → 必须写内层原生 input 才触发 v-model */
      function typeName(value) {
        var host = f.contentDocument.querySelector('[data-testid="name-input"]')
        if (!host) return 'NOT_FOUND'
        var el = host.tagName === 'INPUT' ? host : host.querySelector('input')
        if (!el) return 'NO_NATIVE_INPUT'
        el.focus()
        el.value = value
        el.dispatchEvent(new Event('input', { bubbles: true }))
        return 'TYPED'
      }

      function toastText(doc) {
        var el = doc.querySelector('uni-toast .uni-toast__content, .uni-toast__content, uni-toast')
        return el ? el.textContent.trim() : ''
      }

      function hashNow() {
        try { return String(f.contentWindow.location.hash) } catch (e) { return 'ERR:' + e.message }
      }

      function waitFor(sel, maxTries) {
        return new Promise(function (resolve) {
          var n = 0
          function tick() {
            n++
            var ok = false
            try { ok = !!f.contentDocument.querySelector(sel) } catch (e) { ok = false }
            if (ok) return resolve('READY(tries=' + n + ')')
            if (n >= (maxTries || 40)) return resolve('TIMEOUT(tries=' + n + ')')
            setTimeout(tick, 200)
          }
          tick()
        })
      }

      function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms) }) }
      function textIn(sel) {
        try { var e = f.contentDocument.querySelector(sel); return e ? e.textContent.trim() : null } catch (err) { return 'ERR:' + err.message }
      }
      function countIn(sel) {
        try { return f.contentDocument.querySelectorAll(sel).length } catch (err) { return -1 }
      }

      async function main() {
        try {
          await waitFor('[data-testid="card-basic"]')
          await sleep(1300)
          phase(1)
          if (NO_ACTION || SCENARIO !== 'actions') return

          /* phase2：凭证选择（真实 GET /api/v1/credentials → 选中 GET /api/v1/credentials/c1 → 模型行带出） */
          var openPanel = clickIn('[data-testid="cred-select"]')
          await waitFor('[data-testid="cred-option-c1"]')
          var panelRows = countIn('[data-testid="cred-panel"] .panel__row')
          var pick = clickIn('[data-testid="cred-option-c1"]')
          await waitFor('[data-testid="model-row-gpt-4o"]')
          await sleep(900)
          sink(2, {
            clickedSelect: openPanel,
            panelRowCount: panelRows,
            clickedOption: pick,
            chipAfterPick: textIn('[data-testid="chip-model"] .tag__text'),
            credValue: textIn('[data-testid="cred-value"]'),
            modelRowCount: countIn('[data-testid^="model-row-"]'),
            modelRows: (function () {
              try {
                return Array.prototype.slice.call(f.contentDocument.querySelectorAll('[data-testid^="model-row-"] .model__name')).map(function (e) { return e.textContent.trim() })
              } catch (err) { return ['ERR:' + err.message] }
            })(),
            emptyStillThere: !!f.contentDocument.querySelector('[data-testid="model-empty"]'),
            docH: Math.max(f.contentDocument.documentElement.scrollHeight, f.contentDocument.body.scrollHeight)
          })

          /* phase3：填名称 → 保存并继续 → 真实 POST /quotes → toast + 跳保存成功页（page-29）
             toast 必须在跳转前采样（1.5s 后会被 uni 收起；落地页自己的取数 toast 也会覆盖它） */
          var typed = typeName('2024Q3 主线路报价')
          await sleep(1200)
          var countText = textIn('[data-testid="name-count"]')
          var saveClick = clickIn('[data-testid="btn-save"]')
          await sleep(900)
          var toastAfterSave = toastText(f.contentDocument)
          await sleep(1500)
          sink(3, {
            typed: typed,
            countAfterType: countText,
            clickedSave: saveClick,
            toastAfterSave: toastAfterSave,
            hashAfterSave: hashNow(),
            successRendered: countIn('[data-testid="success-title"], [data-testid="btn-copy"], .qs--ok') > 0
          })
        } catch (e) {
          sink('error', { message: String(e && e.message), stack: String((e && e.stack) || '').slice(0, 600) })
        }
      }

      main()
    </script>
  </body>
</html>
