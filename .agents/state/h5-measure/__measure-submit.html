    <!-- 430x900 iframe 模拟小程序视口；只给 DOM 数字，不靠 vision 猜

    <script>
      var SHOT_ONLY = /(\?|&)shot=1/.test(location.search)

      function all(d, sel) { return Array.prototype.slice.call(d.querySelectorAll(sel)) }
      function rectEl(el) {
        if (!el) return null
        var r = el.getBoundingClientRect()
        return { x: Math.round(r.x), top: Math.round(r.top), right: Math.round(r.right), bottom: Math.round(r.bottom), w: Math.round(r.width), h: Math.round(r.height) }
      }
      function rect(d, sel) { return rectEl(d.querySelector(sel)) }
      function rects(d, sel) { return all(d, sel).map(rectEl) }
      function textOf(d, sel) { var e = d.querySelector(sel); return e ? e.textContent.trim() : null }
      function texts(d, sel) { return all(d, sel).map(function (e) { return e.textContent.trim() }) }
      function styleOf(w, el, prop) { return el ? w.getComputedStyle(el)[prop] : null }
      function c(d, w, sel, prop) { return styleOf(w, d.querySelector(sel), prop) }

      /** 设计 PNG 色带实测（fit_content 行的真实高度，命令见文件头注释） */
      var DESIGN = {
        frameW: 430, topbarH: 96, barH: 84,
        cardTop: [108, 253, 437, 586],
        cardH: [133, 172, 137, 354],
        cardGap: 12, cardLeft: 16, cardRight: 414,
        noteH: 56, hintRowH: 21, labelH: 18, noteLineH: 16,
        barPaddingTop: 12, barPaddingBottom: 24, barPaddingX: 16,
        ghostW: 156, ghostH: 48, primaryW: 230, primaryH: 48, primaryGap: 6
      }

      /** 设计里每个独立文本图层（逐字抄自 design.tree.json，page-4-2）
       *  ⚠️ 两个输入框的**值**（华东主线路 · GPT 通道 / https://api.example-llm.com/v1）不在 innerText 里
       *  （<input> 的 value 不是文本节点）→ 由 aliasValue / baseUrlValue 两条 checks 直接断言，不放这里 */
      var needText = [
        '接入凭证', '主凭证',
        '凭证名称', '建议 6–24 字',
        'BaseURL',
        '凭证仅用于平台检测与转发调用，全程加密存储，不会对外泄露。',
        'APIKey', '已配置',
        '如已轮换密钥，请在此更新后重新检测',
        '模型清单', '已选 3 个', '按厂商勾选，自动生成本次接入检测清单',
        'OpenAI', 'gpt-4o', 'gpt-4o-mini', 'gpt-3.5-turbo',
        'Anthropic', 'claude-3-5-sonnet', 'claude-3-opus',
        '128K · 500 RPM', '16K · 200 RPM', '200K · 300 RPM', '200K · 120 RPM',
        '仅展示 2 个厂商，查看更多厂商 ›',
        '保存草稿', '提交检测'
      ]

      /** 设计行顺序 / 规格 / 勾选态（逐行抄自 design.tree.json） */
      var designModelOrder = ['gpt-4o', 'gpt-4o-mini', 'gpt-3.5-turbo', 'claude-3-5-sonnet', 'claude-3-opus']
      var designSpecOrder = ['128K · 500 RPM', '128K · 500 RPM', '16K · 200 RPM', '200K · 300 RPM', '200K · 120 RPM']
      var designChecked = [true, true, false, true, false]
      var designVendorOrder = ['OpenAI', 'Anthropic']

      /** 已知 mock/设计冲突（同一份共享 mock 无法同时满足两帧设计值，非页面缺陷）：
       *  脱敏值：设计稿 page-4-2 为 sk-••••••••••••••••4f2a；共享 mock c1 为 sk-prod-••••••••2f9a（page-9 需求） */
      var knownMockConflicts = {
        apiKeyMask: { design: 'sk-••••••••••••••••4f2a', mock: 'sk-prod-••••••••2f9a' }
      }

      /** 归一化：48px → 48；rgba(29,78,216,1) → 'rgb(29,78,216)'（alpha=1 时 Chrome 序列化成 rgb()）；
       *  alpha≠1 保留 'rgba(r,g,b,a)' */
      function norm(v) {
        if (v === null || v === undefined) return v
        var s = String(v).trim()
        var m = s.match(/^(-?\d+(?:\.\d+)?)px$/)
        if (m) return Number(m[1])
        var r = s.match(/^rgba?\(([^)]+)\)$/)
        if (r) {
          var p = r[1].split(',').map(function (x) { return Number(String(x).trim()) })
          if (p.length > 3 && p[3] !== 1) return 'rgba(' + p[0] + ',' + p[1] + ',' + p[2] + ',' + p[3] + ')'
          return 'rgb(' + p.slice(0, 3).join(',') + ')'
        }
        return s
      }

      function build(doc, win) {
        var checks = []
        function chk(k, got, want) {
          var gg = norm(got), ww = norm(want)
          checks.push({ k: k, got: gg, want: ww, ok: gg === ww })
        }
        function chkS(k, got, want) { checks.push({ k: k, got: got, want: want, ok: got === want }) }
        function dim(sel, key) { var r = rect(doc, sel); return r ? r[key] : null }
        function c(sel, prop) { return styleOf(win, doc.querySelector(sel), prop) }
        function cs(sel, prop) { return all(doc, sel).map(function (e) { return styleOf(win, e, prop) }) }
        /** 读样式表里的**声明值**（computed 是 used value：Chrome 会把 1.5px/0.8px 取整） */
        function declared(sel, prop) {
          var sheets = doc.styleSheets
          for (var s = 0; s < sheets.length; s++) {
            var rules
            try { rules = sheets[s].cssRules } catch (e) { continue }
            for (var r = 0; r < rules.length; r++) {
              var rule = rules[r]
              var st = rule.selectorText
              if (!st || !rule.style) continue
              var parts = st.split(',')
              for (var p = 0; p < parts.length; p++) {
                var base = parts[p].replace(/\[[^\]]*\]/g, '').trim()
                if (base === sel) {
                  var v = rule.style[prop]
                  if (v) return v
                }
              }
            }
          }
          return null
        }
        /** box-shadow → {x,y,blur,spread,color}（Chrome 序列化为「颜色 偏移 模糊 扩散」，颜色在前） */
        function shadowOf(sel) {
          var el = doc.querySelector(sel)
          var none = { x: null, y: null, blur: null, spread: null, color: null }
          if (!el) return none
          var s = win.getComputedStyle(el).boxShadow
          if (!s || s === 'none') return none
          var m = s.match(/^(rgba?\([^)]*\)|\S+)\s+(-?[\d.]+)px\s+(-?[\d.]+)px\s+(-?[\d.]+)px(?:\s+(-?[\d.]+)px)?/)
          if (!m) return { x: null, y: null, blur: null, spread: null, color: s.replace(/\s+/g, '') }
          return {
            x: Number(m[2]), y: Number(m[3]), blur: Number(m[4]),
            spread: m[5] === undefined ? 0 : Number(m[5]),
            color: m[1].replace(/\s+/g, '')
          }
        }

        /* ── 页面容器（设计 f4c725a0 提交接入凭证页） ─────────────── */
        chk('page.frameWidth', dim('.submit-page', 'w'), DESIGN.frameW)
        chk('page.bg', c('.submit-page', 'backgroundColor'), 'rgba(248,250,252,1)')
        chk('page.flexDir', c('.submit-page', 'flexDirection'), 'column')

        /* ── 顶部导航（设计 0fa01a4a · padding 48/16/12/16 · 高 96） ── */
        chk('topbar.paddingTop', c('.submit-page__topbar', 'paddingTop'), '48px')
        chk('topbar.paddingRight', c('.submit-page__topbar', 'paddingRight'), '16px')
        chk('topbar.paddingBottom', c('.submit-page__topbar', 'paddingBottom'), '12px')
        chk('topbar.paddingLeft', c('.submit-page__topbar', 'paddingLeft'), '16px')
        chk('topbar.bg', c('.submit-page__topbar', 'backgroundColor'), 'rgba(255,255,255,1)')
        chk('topbar.height', dim('.submit-page__topbar', 'h'), DESIGN.topbarH)
        chk('topbar.alignItems', c('.submit-page__topbar', 'alignItems'), 'center')
        chk('topbar.top', dim('.submit-page__topbar', 'top'), 0)

        /* 返回图标盒（设计 a01faac9：remixicon 24px → 盒宽 26 · 行框 24×1.5=36，撑出栏高 96） */
        var back = rect(doc, '[data-testid="back-btn"]')
        var title = rect(doc, '.submit-page__title')
        chk('backBox.w', back && back.w, 26)
        chk('backBox.h', back && back.h, 36)
        chk('backBox.left', back && back.x, 16)
        chk('backBox.centerY', back ? back.top + back.h / 2 : null, 48 + 36 / 2)
        chk('title.leftGap', back && title ? title.x - back.right : null, 12)
        chk('title.text', textOf(doc, '.submit-page__title'), '接入凭证')
        chk('title.fontSize', c('.submit-page__title', 'fontSize'), '17px')
        chk('title.fontWeight', c('.submit-page__title', 'fontWeight'), '700')
        chk('title.color', c('.submit-page__title', 'color'), 'rgba(15,23,42,1)')

        /* 主凭证 chip（设计 62c388f2：h22 · r11 · padding 0/8 · bg rgb(239,246,255)） */

        chk('primaryChip.h', chip && chip.h, 22)
        chk('primaryChip.radius', c('[data-testid="primary-chip"]', 'borderRadius'), '11px')
        chk('primaryChip.paddingLeft', c('[data-testid="primary-chip"]', 'paddingLeft'), '8px')
        chk('primaryChip.bg', c('[data-testid="primary-chip"]', 'backgroundColor'), 'rgba(239,246,255,1)')
        chk('primaryChip.right', chip && chip.right, 414)
        chk('primaryChip.text', textOf(doc, '.chip--primary .chip__text'), '主凭证')
        chk('primaryChip.fontSize', c('.chip--primary .chip__text', 'fontSize'), '11px')
        chk('primaryChip.fontWeight', c('.chip--primary .chip__text', 'fontWeight'), '600')
        chk('primaryChip.color', c('.chip--primary .chip__text', 'color'), 'rgba(37,99,235,1)')

        /* ── 表单区（设计 0b3224f1 · padding 12/16/0/16） ─────────── */

        chk('form.paddingLeft', c('.submit-page__form', 'paddingLeft'), '16px')
        chk('form.paddingRight', c('.submit-page__form', 'paddingRight'), '16px')
        chk('form.flexDir', c('.submit-page__form', 'flexDirection'), 'column')

        /* ── 四张卡片的绝对几何（设计 PNG 色带实测） ─────────────── */
        var cards = rects(doc, '.card')
        chk('card.count', cards.length, 4)
        chk('card0.top', cards[0] && cards[0].top, DESIGN.cardTop[0])
        chk('card0.h', cards[0] && cards[0].h, DESIGN.cardH[0])
        chk('card1.top', cards[1] && cards[1].top, DESIGN.cardTop[1])
        chk('card1.h', cards[1] && cards[1].h, DESIGN.cardH[1])
        chk('card2.top', cards[2] && cards[2].top, DESIGN.cardTop[2])
        chk('card2.h', cards[2] && cards[2].h, DESIGN.cardH[2])
        chk('card3.top', cards[3] && cards[3].top, DESIGN.cardTop[3])
        chk('card3.h', cards[3] && cards[3].h, DESIGN.cardH[3])
        chk('card0.bottom', cards[0] && cards[0].bottom, DESIGN.cardTop[1] - DESIGN.cardGap)
        chk('card.gap0to1', cards[0] && cards[1] ? cards[1].top - cards[0].bottom : null, DESIGN.cardGap)
        chk('card.gap1to2', cards[1] && cards[2] ? cards[2].top - cards[1].bottom : null, DESIGN.cardGap)
        chk('card.gap2to3', cards[2] && cards[3] ? cards[3].top - cards[2].bottom : null, DESIGN.cardGap)
        chk('card3.bottom', cards[3] && cards[3].bottom, 940)
        chk('card.left0', cards[0] && cards[0].x, DESIGN.cardLeft)
        chk('card.right0', cards[0] && cards[0].right, DESIGN.cardRight)
        chk('card.bg', c('.card', 'backgroundColor'), 'rgba(255,255,255,1)')
        chk('card.radius', c('.card', 'borderRadius'), '16px')
        chk('card.paddingTop', c('.card', 'paddingTop'), '16px')
        chk('card.paddingBottom', c('.card', 'paddingBottom'), '16px')
        chk('card.paddingLeft', c('.card', 'paddingLeft'), '20px')
        chk('card.paddingRight', c('.card', 'paddingRight'), '20px')
        /* 设计 stroke = Figma center 1px rgb(238,242,247)（不占布局）→ 实现用 box-shadow 表达：
           扩散 1 · 模糊 0 · 无偏移；用 border 会把内容宽压成 356（设计 358） */
        var cardShadow = shadowOf('.card')
        chk('card.strokeSpread', cardShadow.spread, 1)
        chk('card.strokeBlur', cardShadow.blur, 0)
        chk('card.strokeOffsetX', cardShadow.x, 0)
        chk('card.strokeOffsetY', cardShadow.y, 0)
        chk('card.strokeColor', cardShadow.color, 'rgb(238,242,247)')
        chk('card.flow', c('.card', 'flexDirection'), 'column')

        /* 标签（设计 86bddf34 / a94df599 / 4ce95810 内「APIKey」/ 9a25e41e：13px/500 · 行高 18） */
        chkS('label.texts', texts(doc, '.card__label').join('|'), '凭证名称|BaseURL|APIKey|模型清单')

        /* 设计：标签 → 容器 padding-top 8 → 输入框（比较输入框上边与标签下边） */

        /* ── 输入框（设计 fcbd984c / 06d0e6b5：46 高 · r12 · padding 0/12） ── */
        chk('inputBox.count', all(doc, '.input-box').length, 3)
        chk('inputBox.h', dim('.input-box', 'h'), 46)
        chk('inputBox.radius', c('.input-box', 'borderRadius'), '12px')
        chk('inputBox.bg', c('.input-box', 'backgroundColor'), 'rgba(248,250,252,1)')
        chk('inputBox.paddingLeft', c('.input-box', 'paddingLeft'), '12px')
        chk('inputBox.paddingRight', c('.input-box', 'paddingRight'), '12px')
        chkS('inputBox.strokeDeclaredWidth', declared('.input-box', 'borderWidth'), '1px')
        chk('inputBox.strokeColor', c('.input-box', 'borderTopColor'), 'rgba(226,232,240,1)')

        chk('inputBox.w', dim('.input-box', 'w'), 358)
        /* 图标盒：设计 20c5e850 / 93df1e70 / f29363b4 = remixicon 18px → 盒宽 20 */

        chk('keyGlyph.w', dim('.glyph--key', 'w'), 20)

        /* 输入值（设计 1c7f8d8e / 1cb50980：14px Regular rgb(51,65,85)） */
        chk('aliasInput.fontSize', c('[data-testid="alias-input"]', 'fontSize'), '14px')
        chk('aliasInput.fontWeight', c('[data-testid="alias-input"]', 'fontWeight'), '400')
        chk('aliasInput.color', c('[data-testid="alias-input"]', 'color'), 'rgba(51,65,85,1)')
        chkS('aliasValue', (function () {
          var e = doc.querySelector('[data-testid="alias-input"]')
          if (!e) return null
          var inner = e.querySelector('input')
          return (inner ? inner.value : e.value) || ''
        })(), '华东主线路 · GPT 通道')
        chkS('baseUrlValue', (function () {
          var e = doc.querySelector('[data-testid="baseurl-input"]')
          if (!e) return null

      function collect(doc, win) {
        var over = []
        doc.querySelectorAll('*').forEach(function (el) {
          /* uni-app 内部测量元素（uni-resize-sensor / uni-picker 空 div）不算页面溢出 */
          if (el.closest && el.closest('uni-resize-sensor')) return
          if (el.tagName === 'UNI-RESIZE-SENSOR') return
          var r = el.getBoundingClientRect()
          if (r.width > 0 && r.right > win.innerWidth + 0.5) {
            over.push({ tag: el.tagName, cls: String(el.className || '').slice(0, 70), right: Math.round(r.right) })
          }
        })
        function rect(sel) {
          var el = doc.querySelector(sel)
          if (!el) return null
          var r = el.getBoundingClientRect()
          return { x: Math.round(r.x), top: Math.round(r.top), right: Math.round(r.right), bottom: Math.round(r.bottom), w: Math.round(r.width) }
        }
        var text = (doc.body && doc.body.innerText) || ''
        var barR = rect('.submit-bar')
        var viewportH = win.innerHeight
        var checks = build(doc, win)
        var fails = checks.filter(function (c) { return !c.ok })
        var snapshot = {
          innerWidth: win.innerWidth,
          innerHeight: viewportH,
          docScrollWidth: doc.documentElement.scrollWidth,
          docScrollHeight: Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight),
          overflowingCount: over.length,
          overflowing: over.slice(0, 20),
          missingTexts: needText.filter(function (t) { return text.indexOf(t) === -1 }),
          checkCount: checks.length,
          checkFailCount: fails.length,
          checkFails: fails,
          checkKeys: checks.map(function (c) { return c.k }),
          knownMockConflicts: knownMockConflicts,
          cardRects: Array.prototype.map.call(doc.querySelectorAll('.card'), function (e) {
            var r = e.getBoundingClientRect()
            return { top: Math.round(r.top), bottom: Math.round(r.bottom), h: Math.round(r.height) }
          }),
          topbarRect: rect('.submit-page__topbar'),
          cardCount: doc.querySelectorAll('.card').length,
          vendorGroupCount: doc.querySelectorAll('[data-testid="vendor-group"]').length,
          modelRowCount: doc.querySelectorAll('[data-testid="model-row"]').length,
          checkedCount: doc.querySelectorAll('.model-row__box--checked').length,
          selectedCountText: (function () { var e = doc.querySelector('[data-testid="selected-count"]'); return e ? e.textContent.trim() : null })(),
          catalogMoreText: (function () { var e = doc.querySelector('[data-testid="catalog-more"]'); return e ? e.textContent.trim() : null })(),
          apikeyMaskText: (function () { var e = doc.querySelector('[data-testid="apikey-mask"]'); return e ? e.textContent.trim() : null })(),
          apikeyMaskHeight: (function () { var e = doc.querySelector('[data-testid="apikey-mask"]'); return e ? Math.round(e.getBoundingClientRect().height) : null })(),
          primaryChipText: (function () { var e = doc.querySelector('[data-testid="primary-chip"]'); return e ? e.textContent.trim() : null })(),
          configuredChipText: (function () { var e = doc.querySelector('.chip--success'); return e ? e.textContent.trim() : null })(),
          barPinned: barR ? Math.abs(barR.bottom - viewportH) <= 2 : null,
          barTop: barR ? barR.top : null,
          barHeight: barR ? barR.h : null,
          ghostBtn: rect('[data-testid="save-btn"]'),
          submitBtnRect: rect('[data-testid="submit-btn"]'),
          emojiInText: /[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/u.test(text)
        }
        /* 固定操作条是否遮挡内容：滚到底后再取一次 */
        win.scrollTo(0, 1e6)
        var last = doc.querySelectorAll('.card')
        var lastCard = last.length ? last[last.length - 1].getBoundingClientRect() : null
        var barAtBottom = doc.querySelector('.submit-bar').getBoundingClientRect()
        snapshot.scrollYMax = win.scrollY
        snapshot.atBottom = {
          lastCardBottom: lastCard ? Math.round(lastCard.bottom) : null,
          barTop: Math.round(barAtBottom.top),
          lastCardFullyAboveBar: lastCard ? Math.round(lastCard.bottom) <= Math.round(barAtBottom.top) + 1 : null
        }
        win.scrollTo(0, 0)
        return snapshot
      }

      /* 轮询取数：iframe 的 load 事件常因监听注册过晚而错过 → 静默拿到 pending */
      var tries = 0
      var timer = setInterval(function () {
        tries++
        var f = document.getElementById('f')
        var payload = null
        try {
          payload = collect(f.contentDocument, f.contentWindow)
        } catch (e) {
          payload = { error: String(e && e.message) }
        }
        var ready = payload && payload.checkCount > 0 && payload.modelRowCount === 5
        if (ready || tries > 40) {
          clearInterval(timer)
          if (!SHOT_ONLY) {
            payload.iframeRect = null
            payload.outerInnerWidth = window.innerWidth
            document.getElementById('m').textContent = 'MEASURE_JSON:' + JSON.stringify(payload)
          }
        }
      }, 500)
