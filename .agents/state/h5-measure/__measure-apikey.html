<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>measure-quote-form-apikey</title>
    <style>
      body { margin: 0; font: 12px monospace; }
      iframe { width: 430px; height: 900px; border: 0; }
      /* 取数用 <pre> 包进 0 尺寸 overflow:hidden 容器：textContent 可读，但不渲染、不会被 --screenshot 截进图里 */
      #sink { position: absolute; top: 0; left: 0; width: 0; height: 0; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- 430 宽 iframe 模拟小程序视口；数字优先，不靠 vision 猜
         页面 12-v2：/pages/quote-form/apikey（【报价管理】新增报价单-APIKey 下拉展开，page-apikey）
         设计基线（设计截图 1:1 · 430x1129，见 .agents/state/fetch-design.py page-apikey）：
           顶栏 0..101(102) · 内容区 padding 16/16/20/16 gap 16
           基本信息卡 top 118：凭证选择框 432..480(48) → 面板紧贴 480（padding 6 · r[0,0,12,12]）
             面板首行（选中态）484..538(54) · 第二行 540..595(55，「沙箱」标 558..576) · 第三行 595..650(55，「专用」标 613..631)
             分隔线（pt4）· 底部操作（pt4 · padding 8/12）· 面板底 ≈700 · 凭证说明 pt10
           模型列表卡：空态盒（padding 28/16 · 无 pt6 说明包裹层）817..975(158)
           底栏 padding 12/16/28/16 · 页高 1129（= 设计帧 PNG 高度）
         本帧差异（与 12-v1 / page-26 同页不同帧，已写台账）：
           无步骤卡 · 无空态提示卡 · 空态说明「选择凭证后将自动带出可用模型」· 面板展开态
         phase1 = 首屏（面板展开 + GET /api/v1/credentials）· 整页高度回填 iframe 供截图
         phase2 = 选 c2（GET /api/v1/credentials/c2）→ 面板收起 / 别名 / 模型行 / chip；再展开 → 选中行高亮 + 对勾
         phase3 = 填名称（内层原生 input）→ 点「保存并继续」→ 真实 POST /api/v1/quotes[+/q9/items] → 跳模型定价页
         phase4 = 点「前往「我的设置」新建凭证」→ 目标路由 /pages/settings/index（台账序号 23 未实现）
         截图另跑 ?noaction=1（交互回放会把 iframe 导航走） -->
    <iframe id="f" src="/index.html#/pages/quote-form/apikey"></iframe>
    <div id="sink"><pre id="m">pending</pre></div>
    <script>
      var f = document.getElementById('f')
      var acc = {}

      function all(doc, sel) { return Array.prototype.slice.call(doc.querySelectorAll(sel)) }
      function rect(doc, sel) {
        var el = doc.querySelector(sel)
        if (!el) return null
        var r = el.getBoundingClientRect()
        return { x: Math.round(r.x), top: Math.round(r.top), right: Math.round(r.right), bottom: Math.round(r.bottom), w: Math.round(r.width), h: Math.round(r.height) }
      }
      function rects(doc, sel) {
        return all(doc, sel).map(function (e) {
          var r = e.getBoundingClientRect()
          return { x: Math.round(r.x), top: Math.round(r.top), right: Math.round(r.right), w: Math.round(r.width), h: Math.round(r.height) }
        })
      }
      function texts(doc, sel) { return all(doc, sel).map(function (e) { return e.textContent.trim() }) }
      function textOf(doc, sel) { var e = doc.querySelector(sel); return e ? e.textContent.trim() : null }
      function attrOf(doc, sel, name) { var e = doc.querySelector(sel); return e ? e.getAttribute(name) : null }
      function attrsOf(doc, sel, name) { return all(doc, sel).map(function (e) { return e.getAttribute(name) }) }
      function colorOf(doc, win, sel, prop) { var el = doc.querySelector(sel); return el ? win.getComputedStyle(el)[prop] : null }
      function styleOf(doc, win, sel) {
        var el = doc.querySelector(sel)
        if (!el) return null
        var cs = win.getComputedStyle(el)
        return { fontSize: cs.fontSize, fontWeight: cs.fontWeight, color: cs.color, lineHeight: cs.lineHeight, display: cs.display, borderRadius: cs.borderRadius, padding: cs.padding, backgroundColor: cs.backgroundColor, maxWidth: cs.maxWidth }
      }
      function bgsOf(doc, win, sel) {
        return all(doc, sel).map(function (e) { return win.getComputedStyle(e).backgroundColor })
      }

      /** 设计稿里每一个独立文本图层（文案完整性检查清单，逐字抄自 page-apikey design.tree.json）
          注意：本帧**没有**「为必填项」/「报价单号由系统按日期与序号规则…」/「填写须知」三条（与 page-26 的帧级差异） */
      var needText = [
        '新增报价单', '填写基本信息并设置模型报价',
        '基本信息', '报价单名称', '*',
        '请输入报价单名称，如：2024Q3 主线路报价', '0/30',
        '报价单号', '系统生成', '保存后自动生成', 'QT-XXXXXXXX-XXXX',
        '凭证名称', '请选择凭证', '选择凭证后，系统将自动带出该凭证下可用的模型列表',
        '生产环境密钥', '常用', 'sk-prod-••••••••2f9a · 12 个模型',
        '测试环境密钥', '沙箱', 'sk-test-••••••••7b31 · 8 个模型',
        '数据标注专用', '专用', 'sk-label-••••••••a4c8 · 5 个模型',
        '前往「我的设置」新建凭证',
        '模型列表', '待带出', '尚未加载模型', '选择凭证后将自动带出可用模型',
        '保存成功后系统将自动生成报价单号', '存为草稿', '保存并继续'
      ]

      function collect(doc, win) {
        var over = []
        all(doc, '*').forEach(function (el) {
          var r = el.getBoundingClientRect()
          if (r.width > 0 && r.right > win.innerWidth + 0.5) {
            over.push({ tag: el.tagName, cls: String(el.className || '').slice(0, 70), left: Math.round(r.x), w: Math.round(r.width), right: Math.round(r.right), html: String(el.outerHTML || '').slice(0, 140) })
          }
        })
        var text = (doc.body && doc.body.innerText) || ''
        return {
          innerWidth: win.innerWidth,
          docScrollWidth: doc.documentElement.scrollWidth,
          docScrollHeight: Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight),
          overflowingCount: over.length,
          overflowing: over.slice(0, 12),
          missingTexts: needText.filter(function (t) { return text.indexOf(t) === -1 }),
          pageBg: colorOf(doc, win, '.qf', 'backgroundColor'),
          page: rect(doc, '.qf'),
          nav: rect(doc, '.qf__nav'),
          navPad: colorOf(doc, win, '.qf__nav', 'padding'),
          navTitleStyle: styleOf(doc, win, '.nav__title'),
          bodyPad: colorOf(doc, win, '.qf__body', 'padding'),
          bodyGap: colorOf(doc, win, '.qf__body', 'gap'),
          stepCardCount: all(doc, '.step-card').length,
          cards: rects(doc, '.card'),
          cardPadding: colorOf(doc, win, '.card', 'padding'),
          cardHead: rects(doc, '.card__head'),
          required: rect(doc, '[data-testid="chip-required"]'),
          nameLabel: rect(doc, '[data-testid="name-label"]'),
          nameBox: rect(doc, '.input-box'),
          nameCounter: rect(doc, '[data-testid="name-count"]'),
          dividers: rects(doc, '.divider'),
          quoteNoBox: rect(doc, '[data-testid="quote-no-box"]'),
          quoteNoHint: rect(doc, '[data-testid="quote-no-hint"]'),
          credLabel: rect(doc, '[data-testid="cred-label"]'),
          credSelect: rect(doc, '[data-testid="cred-select"]'),
          credSelectOpen: attrOf(doc, '[data-testid="cred-select"]', 'data-open'),
          credSelectRadius: colorOf(doc, win, '.select', 'borderRadius'),
          credSelectBorder: colorOf(doc, win, '[data-testid="cred-select"]', 'borderColor'),
          credKeyboxBg: colorOf(doc, win, '.select__keybox', 'backgroundColor'),
          credKeybox: rect(doc, '.select__keybox'),
          credValue: textOf(doc, '[data-testid="cred-value"]'),
          credValueStyle: styleOf(doc, win, '.select__value'),
          chevronUp: all(doc, '.ic-chevron--up').length,
          credPanel: rect(doc, '[data-testid="cred-panel"]'),
          credPanelPad: colorOf(doc, win, '.panel', 'padding'),
          credPanelRadius: colorOf(doc, win, '.panel', 'borderRadius'),
          credPanelBorder: colorOf(doc, win, '.panel', 'borderColor'),
          credPanelBorderTop: colorOf(doc, win, '.panel', 'borderTopWidth'),
          credHint: rect(doc, '[data-testid="cred-hint"]'),
          optionRows: rects(doc, '[data-testid^="cred-option-"]'),
          optionSelected: attrsOf(doc, '[data-testid^="cred-option-"]', 'data-selected'),
          optionRowBgs: bgsOf(doc, win, '.panel__row'),
          optionIconBgs: bgsOf(doc, win, '.panel__icon'),
          requiredCount: all(doc, '[data-testid="chip-required"]').length,
          quoteNoHintCount: all(doc, '[data-testid="quote-no-hint"]').length,
          optionTitles: texts(doc, '.panel__title'),
          optionSubs: texts(doc, '[data-testid^="cred-sub-"]'),
          subRects: rects(doc, '[data-testid^="cred-sub-"]'),
          subStyle: styleOf(doc, win, '.panel__sub'),
          recTags: texts(doc, '.rec-tag__text'),
          recTagRects: rects(doc, '.rec-tag'),
          recTagBg: colorOf(doc, win, '.rec-tag', 'backgroundColor'),
          envTags: texts(doc, '.env-tag__text'),
          envTagRects: rects(doc, '.env-tag'),
          envTagBg: colorOf(doc, win, '.env-tag', 'backgroundColor'),
          envTagStyle: styleOf(doc, win, '.env-tag__text'),
          pickedCount: all(doc, '.ic-picked').length,
          pickedRects: rects(doc, '.ic-picked'),
          panelDivider: rect(doc, '.panel__divider'),
          panelDividerWrapPad: colorOf(doc, win, '.panel__divider-wrap', 'padding'),
          panelAction: rect(doc, '.panel__action'),
          panelActionPad: colorOf(doc, win, '.panel__action', 'padding'),
          panelActionText: textOf(doc, '[data-testid="cred-create"]'),
          panelActionStyle: styleOf(doc, win, '.panel__action-text'),
          chipModel: rect(doc, '[data-testid="chip-model"]'),
          chipModelText: textOf(doc, '[data-testid="chip-model"]'),
          empty: rect(doc, '[data-testid="model-empty"]'),
          emptyPad: colorOf(doc, win, '.empty', 'padding'),
          emptyIcon: rect(doc, '.empty__icon'),
          emptyTitle: rect(doc, '[data-testid="model-empty-title"]'),
          emptyDescWrapPad: colorOf(doc, win, '.empty__desc-wrap', 'paddingTop'),
          emptyDesc: rect(doc, '[data-testid="model-empty-desc"]'),
          emptyDescText: textOf(doc, '[data-testid="model-empty-desc"]'),
          tipCount: all(doc, '[data-testid="model-empty-tip"]').length,
          noticeCardCount: all(doc, '[data-testid="card-notice"]').length,
          bar: rect(doc, '.qf__bar'),
          barPad: colorOf(doc, win, '.qf__bar', 'padding'),
          barHint: rect(doc, '[data-testid="bar-hint"]'),
          draftBtn: rect(doc, '[data-testid="btn-draft"]'),
          saveBtn: rect(doc, '[data-testid="btn-save"]'),
          saveBtnBg: colorOf(doc, win, '[data-testid="btn-save"]', 'backgroundColor'),
          modelRows: rects(doc, '[data-testid^="model-row-"]'),
          inputCount: all(doc, 'input,textarea').length,
          tabbarExists: !!doc.querySelector('.tabbar'),
          userAgent: win.navigator.userAgent
        }
      }

      function sink(n, payload) {
        acc['phase' + n] = payload
        document.getElementById('m').textContent = 'MEASURE_JSON:' + JSON.stringify(acc)
      }
      function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms) }) }

      function collect1() {
        try {
          var payload = collect(f.contentDocument, f.contentWindow)
          f.style.height = payload.docScrollHeight + 'px'
          acc.iframeHeightForShot = payload.docScrollHeight
          sink(1, payload)
          return payload
        } catch (e) {
          sink(1, { error: String(e && e.message) })
          return null
        }
      }

      function clickIn(sel) {
        var doc = f.contentDocument
        var el = doc.querySelector(sel)
        if (!el) return 'NOT_FOUND'
        var ev = doc.createEvent('MouseEvents')
        ev.initMouseEvent('click', true, true, f.contentWindow, 0, 0, 0, 0, 0, false, false, false, false, 0, null)
        el.dispatchEvent(ev)
        return 'CLICKED'
      }
      function toastText(doc) {
        var el = doc.querySelector('uni-toast .uni-toast__content, .uni-toast__content, uni-toast')
        return el ? el.textContent.trim() : ''
      }
      function hashNow() { try { return String(f.contentWindow.location.hash) } catch (e) { return 'ERR:' + e.message } }

      function waitFor(sel, maxTries) {
        return new Promise(function (resolve) {
          var n = 0
          function tick() {
            n++
            var ok = false
            try { ok = !!f.contentDocument.querySelector(sel) } catch (e) { ok = false }
            if (ok) return resolve('READY(tries=' + n + ')')
            if (n >= (maxTries || 40)) return resolve('TIMEOUT(tries=' + n + ')')
            setTimeout(tick, 200)
          }
          tick()
        })
      }

      /** uni-app H5 的 <input> 渲染成 <uni-input> 宿主 → 必须写内层原生 input 才触发 v-model（见 dev SKILL §4.2） */
      function typeName(value) {
        var host = f.contentDocument.querySelector('[data-testid="name-input"]')
        if (!host) return 'NOT_FOUND'
        var el = host.tagName === 'INPUT' ? host : host.querySelector('input')
        if (!el) return 'NO_NATIVE_INPUT'
        el.focus()
        el.value = value
        el.dispatchEvent(new Event('input', { bubbles: true }))
        return 'TYPED'
      }

      async function main() {
        await waitFor('[data-testid="cred-panel"]')
        await sleep(1400)
        collect1()
        if (location.search.indexOf('noaction') !== -1) return

        /* phase2：选 c2（真实 GET /api/v1/credentials/c2）→ 面板收起；再展开 → 选中行高亮 + 对勾 */
        var pick = clickIn('[data-testid="cred-option-c2"]')
        await waitFor('[data-testid="model-row-gpt-4o"]')
        await sleep(900)
        var afterPick = {
          clickedOption: pick,
          panelExists: !!f.contentDocument.querySelector('[data-testid="cred-panel"]'),
          credValue: textOf(f.contentDocument, '[data-testid="cred-value"]'),
          chipAfterPick: textOf(f.contentDocument, '[data-testid="chip-model"]'),
          modelRowCount: all(f.contentDocument, '[data-testid^="model-row-"]').length,
          emptyStillThere: !!f.contentDocument.querySelector('[data-testid="model-empty"]'),
          hash: hashNow()
        }
        clickIn('[data-testid="cred-select"]')
        await waitFor('[data-testid="cred-option-c2"]')
        await sleep(900)
        sink(2, Object.assign(afterPick, {
          reopenPanel: !!f.contentDocument.querySelector('[data-testid="cred-panel"]'),
          optionSelected: attrsOf(f.contentDocument, '[data-testid^="cred-option-"]', 'data-selected'),
          optionRowBgs: bgsOf(f.contentDocument, f.contentWindow, '.panel__row'),
          optionIconBgs: bgsOf(f.contentDocument, f.contentWindow, '.panel__icon'),
          pickedRects: rects(f.contentDocument, '.ic-picked'),
          envTags: texts(f.contentDocument, '.env-tag__text'),
          optionRows: rects(f.contentDocument, '[data-testid^="cred-option-"]'),
          credPanel: rect(f.contentDocument, '[data-testid="cred-panel"]'),
          credSelect: rect(f.contentDocument, '[data-testid="cred-select"]')
        }))

        /* phase3：点面板底部操作「前往「我的设置」新建凭证」→ /pages/settings/index（台账序号 23 未实现） */
        var hashBeforeCreate = hashNow()
        var createClicked = clickIn('[data-testid="cred-create"]')
        await sleep(1500)
        sink(3, {
          clickedCreate: createClicked,
          hashBeforeCreate: hashBeforeCreate,
          hashAfterCreate: hashNow(),
          settingsRendered: hashNow().indexOf('/pages/settings/index') !== -1,
          stillOnQuoteForm: hashNow().indexOf('/pages/quote-form/apikey') !== -1
        })

        /* phase4：填名称 → 保存并继续 → 真实 POST /api/v1/quotes[+/q9/items] → toast + 跳模型定价页 */
        var typed = typeName('2024Q3 主线路报价')
        await sleep(1200)
        var countText = textOf(f.contentDocument, '[data-testid="name-count"]')
        var saveClick = clickIn('[data-testid="btn-save"]')
        await sleep(2400)
        sink(4, {
          typed: typed,
          countAfterType: countText,
          clickedSave: saveClick,
          toastAfterSave: toastText(f.contentDocument),
          hashAfterSave: hashNow(),
          pricingRendered: hashNow().indexOf('/pages/model-pricing/index') !== -1
        })
      }

      main()
    </script>
  </body>
</html>
