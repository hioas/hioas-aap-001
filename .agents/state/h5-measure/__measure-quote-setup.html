    <script>
      var f = document.getElementById('f')
      var acc = {}
      var SCENARIO = (location.search.match(/scenario=([a-z]+)/) || [])[1] || ''
      var SHOT_ONLY = location.search.indexOf('shot') !== -1
      if (SHOT_ONLY) f.style.height = '1211px' /* = 设计帧高 */

      /* 选择器语法：`sel@@N` = 该选择器的第 N 个匹配（也接受 CSS 里非法的 `sel#N` 写法，先归一化成 @@N）。
         `A@@N B` = 在第 N 个 A 里查 B。 */
      function splitSel(sel) {
        var s = String(sel).replace(/#(\d+)(?=\s|$)/g, '@@$1')
        var i = s.indexOf('@@')
        if (i === -1) return { base: s, n: 0, tail: '' }
        var head = s.slice(0, i)
        var rest = s.slice(i + 2).split(/\s+/)
        return { base: head.trim(), n: Number(rest[0]), tail: rest.slice(1).join(' ') }
      }

      function collect(doc, win, withChecks) {
        var fails = []
        var checks = 0

        function norm(v) {
          if (typeof v === 'number') return v
          var s = String(v == null ? '' : v).trim()
          if (/^-?\d+(\.\d+)?px$/.test(s)) return Number(s.replace('px', ''))
          return s
        }
        function normColor(s) {
          var m = String(s || '').match(/rgba?\(([^)]+)\)/)
          if (!m) return String(s || '')
          var p = m[1].split(',').map(function (t) { return Number(t.trim()) })
          var a = p.length > 3 ? p[3] : 1
          return a === 1 ? 'rgb(' + p[0] + ', ' + p[1] + ', ' + p[2] + ')' : 'rgba(' + p.join(', ') + ')'
        }
        /* box-shadow 的颜色要归一化，但偏移/模糊/扩散必须保留 —— 走 normColor() 会把整串压成只剩颜色 */
        function normShadow(s) {
          return String(s == null ? '' : s).replace(/rgba?\([^)]+\)/g, function (m) { return normColor(m) })
        }
        function declared(sel, prop) {
          /* CSSOM 声明值（非 used 值）：0.8px 描边的 computed 会被 Chrome 取整成 1px，所以判声明值 */
          var sp = splitSel(sel)
          if (!el(sel)) return null
          for (var i = 0; i < doc.styleSheets.length; i++) {
            var rules
            try { rules = doc.styleSheets[i].cssRules } catch (e) { continue }
            for (var j = 0; j < rules.length; j++) {
              var r = rules[j]
              if (!r.selectorText || r.selectorText.indexOf('[') === 0) continue
              var sels = r.selectorText.split(',').map(function (s) { return s.trim().replace(/\[data-v-[^\]]+\]/g, '') })
              if (sels.indexOf(sp.base) === -1) continue
              var v = r.style && r.style[prop]
              if (v) return v
            }
          }
          return null
        }
        function el(sel) {
          var sp = splitSel(sel)
          if (!sp.n && !sp.tail) return doc.querySelector(sp.base)
          var roots = doc.querySelectorAll(sp.base)
          var root = roots[sp.n]
          if (!root) return null
          return sp.tail ? root.querySelector(sp.tail) : root
        }
        function rect(sel) {
          var e = el(sel)
          if (!e) return null
          var r = e.getBoundingClientRect()
          return {
            x: Math.round(r.x), top: Math.round(r.top), right: Math.round(r.right),
            bottom: Math.round(r.bottom), w: Math.round(r.width), h: Math.round(r.height)
          }
        }
        function rects(sel) {
          return Array.prototype.map.call(doc.querySelectorAll(splitSel(sel).base), function (e) {
            var r = e.getBoundingClientRect()
            return { x: Math.round(r.x), top: Math.round(r.top), right: Math.round(r.right), bottom: Math.round(r.bottom), w: Math.round(r.width), h: Math.round(r.height) }
          })
        }
        function css(sel, prop) {
          var e = el(sel)
          if (!e) return null
          var v = win.getComputedStyle(e)[prop]
          if (prop === 'boxShadow') return normShadow(v)
          return prop.toLowerCase().indexOf('color') >= 0 ? normColor(v) : norm(v)
        }
        function chk(key, got, want, tol) {
          if (!withChecks) return got
          checks++
          var t = tol == null ? 0 : tol
          var g = norm(got)
          var w = norm(want)
          var gn = typeof g === 'number' ? g : (typeof g === 'string' && /^-?\d+(\.\d+)?$/.test(g) ? Number(g) : null)
          var wn = typeof w === 'number' ? w : (typeof w === 'string' && /^-?\d+(\.\d+)?$/.test(w) ? Number(w) : null)
          var ok
          if (gn !== null && wn !== null) ok = Math.abs(gn - wn) <= t
          else ok = g === w
          if (!ok) fails.push({ k: key, got: got, want: want })
          return got
        }
        /* chkR 的字段由 key 末段决定：.h/.w/.x/.left/.right/.top/.bottom */
        function rectField(sel, key) {
          var r = rect(sel)
          if (!r) return null
          var f = String(key).split('.').pop()
          if (f === 'x' || f === 'left') return r.x
          if (f === 'right') return r.right
          if (f === 'top') return r.top
          if (f === 'bottom') return r.bottom
          if (f === 'w' || f === 'width') return r.w
          if (f === 'h' || f === 'height') return r.h
          return r
        }
        function chkR(key, sel, want, tol) { return chk(key, rectField(sel, key), want, tol) }
        function chkC(key, sel, prop, want, tol) { return chk(key, css(sel, prop), want, tol) }
        /* 数值数组逐项比较（设计帧小数坐标链取整后会有 ±1..2 差） */
        function chkList(key, got, want, tol) {
          if (!withChecks) return got
          checks++
          var t = tol == null ? 0 : tol
          var ok = got.length === want.length
          if (ok) {
            for (var i = 0; i < got.length; i++) {
              if (got[i] == null || Math.abs(got[i] - want[i]) > t) { ok = false; break }
            }
          }
          if (!ok) fails.push({ k: key, got: got.join(','), want: want.join(',') })
          return got
        }
        function texts(sel) {
          return Array.prototype.map.call(doc.querySelectorAll(splitSel(sel).base), function (e) { return e.textContent.trim() })
        }
        function colors(sel) {
          return Array.prototype.map.call(doc.querySelectorAll(splitSel(sel).base), function (e) { return normColor(win.getComputedStyle(e).backgroundColor) })
        }
        function textColors(sel) {
          return Array.prototype.map.call(doc.querySelectorAll(splitSel(sel).base), function (e) { return normColor(win.getComputedStyle(e).color) })
        }
        function textOf(sel) {
          var e = el(sel)
          return e ? e.textContent.trim() : null
        }
        function groupOf(sel, groupSel) {
          return Array.prototype.map.call(doc.querySelectorAll(groupSel), function (g) { return g.querySelector(sel) })
        }
        function grpCss(groupSel, sel, prop) {
          return groupOf(sel, groupSel).map(function (e) {
            if (!e) return null
            var v = win.getComputedStyle(e)[prop]
            if (prop === 'boxShadow') return normShadow(v)
            return prop.toLowerCase().indexOf('color') >= 0 ? normColor(v) : norm(v)
          })
        }
        function grpRects(groupSel, sel) {
          return groupOf(sel, groupSel).map(function (e) {
            if (!e) return null
            var r = e.getBoundingClientRect()
            return { x: Math.round(r.x), top: Math.round(r.top), right: Math.round(r.right), bottom: Math.round(r.bottom), w: Math.round(r.width), h: Math.round(r.height) }
          })
        }
        function grpField(groupSel, sel, field) {
          return grpRects(groupSel, sel).map(function (r) {
            if (!r) return null
            var f = String(field).split('.').pop()
            if (f === 'x' || f === 'left') return r.x
            if (f === 'right') return r.right
            if (f === 'top') return r.top
            if (f === 'bottom') return r.bottom
            if (f === 'w' || f === 'width') return r.w
            if (f === 'h' || f === 'height') return r.h
            return null
          })
        }
        function inputValue(testid) {
          var host = doc.querySelector('[data-testid="' + testid + '"]')
          if (!host) return null
          if (host.tagName === 'INPUT' || host.tagName === 'TEXTAREA') return host.value
          var inner = host.querySelector('input,textarea')
          return inner ? inner.value : null
        }
        /* 「框内内容左界」= 设计声明的 padding（Figma center 描边不占布局 → box-shadow） */
        function contentLeft(boxSel, innerSel) {
          var a = rect(boxSel), b = rect(innerSel)
          return a && b ? b.x - a.x : null
        }
        function gapBetween(aSel, bSel) {
          var a = rect(aSel), b = rect(bSel)
          return a && b ? b.top - a.bottom : null
        }

        var CARDS = '.card'
        var MODELS = '[data-testid^="model-row-"]'

        /* ===================== 整页 ===================== */
        chk('page.docHeight', Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight), 1211, 2)
        chkC('page.bg', '.setup', 'backgroundColor', 'rgb(245, 247, 251)')
        chk('page.innerWidth', win.innerWidth, 430)
        chk('page.docScrollWidth', doc.documentElement.scrollWidth, 430)
        chk('page.cardCount', doc.querySelectorAll(CARDS).length, 3)
        /* 设计：卡1 118..266(148) · 卡2 282..559(277) · 卡3 575..1026(451)（PNG 逐行主色实测） */
        chkList('page.cardTops', rects(CARDS).map(function (r) { return r.top }), [118, 282, 575], 2)
        chkList('page.cardHeights', rects(CARDS).map(function (r) { return r.h }), [148, 277, 451], 2)
        chkList('page.cardX', rects(CARDS).map(function (r) { return r.x }), [16, 16, 16], 1)
        chkList('page.cardW', rects(CARDS).map(function (r) { return r.w }), [398, 398, 398], 1)

        /* ===================== 顶部导航（design 3a66a8bd padding[48,16,12,16]） ===================== */
        chkR('nav.h', '.setup__nav', 102, 1) /* PNG: 0..101 */
        chkC('nav.padTop', '.setup__nav', 'paddingTop', 48)
        chkC('nav.padRight', '.setup__nav', 'paddingRight', 16)
        chkC('nav.padBottom', '.setup__nav', 'paddingBottom', 12)
        chkC('nav.padLeft', '.setup__nav', 'paddingLeft', 16)
        chkC('nav.bg', '.setup__nav', 'backgroundColor', 'rgb(255, 255, 255)')
        chkR('nav.back.x', '.nav__back', 16, 1)
        chkR('nav.back.top', '.nav__back', 51, 1) /* 内容行 48..90，36 高居中 → 51（PNG ink 51..87） */
        chkR('nav.back.w', '.nav__back', 36, 1)
        chkR('nav.back.h', '.nav__back', 36, 1)
        chkC('nav.back.radius', '.nav__back', 'borderRadius', 18)
        chkC('nav.back.bg', '.nav__back', 'backgroundColor', 'rgb(241, 245, 249)')
        chkR('nav.backGlyph.w', '.nav__back .ic', 20, 1) /* design 图层 fs=18 → 行框 18×1.5=27、宽 20 */
        chkR('nav.backGlyph.h', '.nav__back .ic', 27, 1)
        chkR('nav.help.right', '.nav__help', 414, 1)
        chkR('nav.help.top', '.nav__help', 51, 1)
        chkR('nav.help.w', '.nav__help', 36, 1)
        chkR('nav.help.h', '.nav__help', 36, 1)
        chkC('nav.help.bg', '.nav__help', 'backgroundColor', 'rgb(241, 245, 249)')
        chkR('nav.helpGlyph.w', '.nav__help .ic', 20, 1)
        chkR('nav.helpGlyph.h', '.nav__help .ic', 27, 1)
        chkR('nav.titles.x', '.nav__titles', 64, 1) /* 16 + 36 + 12（设计顶部左侧 gap 12） */
        chkR('nav.titles.h', '.nav__titles', 42, 1) /* 标题 24 + 副标题 18 */
        chkC('nav.title.fs', '.setup__title', 'fontSize', 18)
        chkC('nav.title.fw', '.setup__title', 'fontWeight', 700) /* design 672c8036 Bold */
        chkC('nav.title.color', '.setup__title', 'color', 'rgb(15, 23, 42)')
        chkC('nav.title.lh', '.setup__title', 'lineHeight', 24) /* design 显式 height=24 */
        chkC('nav.subtitle.fs', '.setup__subtitle', 'fontSize', 12)
        chkC('nav.subtitle.fw', '.setup__subtitle', 'fontWeight', 400) /* design 307dd47e Regular */
        chkC('nav.subtitle.color', '.setup__subtitle', 'color', 'rgb(148, 163, 184)')
        chkC('nav.subtitle.lh', '.setup__subtitle', 'lineHeight', 18) /* design 显式 height=18 */
        chk('nav.titleText', textOf('.setup__title'), '新增报价单')
        chk('nav.subtitleText', textOf('.setup__subtitle'), '填写基本信息并设置模型报价')

        /* ===================== 内容区（design 42124f6a padding[16,16,20,16] gap 16） ===================== */
        chkC('body.padTop', '.setup__body', 'paddingTop', 16)
        chkC('body.padRight', '.setup__body', 'paddingRight', 16)
        chkC('body.padBottom', '.setup__body', 'paddingBottom', 20)
        chkC('body.padLeft', '.setup__body', 'paddingLeft', 16)
        chkC('body.gap', '.setup__body', 'gap', 16)

        /* ===================== 卡片（design padding 16 r16 · drop_shadow(0,4,16,rgba(15,23,42,.06))） ===== */
        chkC('card.padTop', CARDS, 'paddingTop', 16)
        chkC('card.padLeft', CARDS, 'paddingLeft', 16)
        chkC('card.radius', CARDS, 'borderRadius', 16)
        chkC('card.bg', CARDS, 'backgroundColor', 'rgb(255, 255, 255)')
        chk('card.shadow', css(CARDS, 'boxShadow'), 'rgba(15, 23, 42, 0.06) 0px 4px 16px 0px')
        chkC('card.title.fs', '.card__title', 'fontSize', 15)
        chkC('card.title.fw', '.card__title', 'fontWeight', 700) /* design b298624d Bold */
        chkC('card.title.color', '.card__title', 'color', 'rgb(15, 23, 42)')
        chkC('card.title.lh', '.card__title', 'lineHeight', 20) /* 15px 行框 = 15×1.4 → 20（PNG 标题行 134..154 = 20） */
        chkC('card.head.gap', '.card__head', 'gap', 8) /* design 卡片标题行 gap 8 */
        chkR('card.bar.w', '.card__bar', 5, 1)
        chkR('card.bar.h', '.card__bar', 16, 1)
        chkC('card.bar.radius', '.card__bar', 'borderRadius', 2)
        chkC('card.bar.bg', '.card__bar', 'backgroundColor', 'rgb(37, 99, 235)')
        chk('card.titles', texts('.card__title').join('|'), '报价主体|基本信息|模型列表')

        /* 三张卡的标（design caf33d0e / 829d6574 / f73af6cd · h20 r10 padding 0/8） */
        chkR('chip.h', '.chip', 20, 1)
        chkC('chip.radius', '.chip', 'borderRadius', 10)
        chkC('chip.padLeft', '.chip', 'paddingLeft', 8)
        chkC('chip.padRight', '.chip', 'paddingRight', 8)
        chkList('chip.right', rects('[data-testid^="chip-"]').map(function (r) { return r.right }), [398, 398, 398], 2)
        chkList('chip.top', [rect('[data-testid="chip-add-company"]').top, rect('[data-testid="chip-basic-done"]').top, rect('[data-testid="chip-model-count"]').top], [134, 298, 591], 2)
        chkC('chip.neutral.bg', '.chip--neutral', 'backgroundColor', 'rgb(240, 240, 240)')
        chkC('chip.neutral.label.fs', '.chip--neutral .chip__label', 'fontSize', 10) /* design 1ba62cab fs=10 fw=600 */
        chkC('chip.neutral.label.fw', '.chip--neutral .chip__label', 'fontWeight', 600)
        chkC('chip.neutral.label.color', '.chip--neutral .chip__label', 'color', 'rgb(24, 154, 71)') /* design rgba(24,154,71,1) */
        chkC('chip.success.bg', '.chip--success', 'backgroundColor', 'rgb(236, 253, 245)') /* design 829d6574 */
        chkC('chip.success.label.fs', '.chip--success .chip__label', 'fontSize', 10)
        chkC('chip.success.label.fw', '.chip--success .chip__label', 'fontWeight', 600)
        chkC('chip.success.label.color', '.chip--success .chip__label', 'color', 'rgb(22, 163, 74)') /* design dbf550fd rgba(22,163,74,1) */
        chkC('chip.info.bg', '.chip--info', 'backgroundColor', 'rgb(239, 246, 255)') /* design f73af6cd */
        chkC('chip.info.label.fs', '.chip--info .chip__label', 'fontSize', 11) /* design 4d19fa87 fs=11 fw=600 */
        chkC('chip.info.label.fw', '.chip--info .chip__label', 'fontWeight', 600)
        chkC('chip.info.label.color', '.chip--info .chip__label', 'color', 'rgb(37, 99, 235)') /* design rgba(37,99,235,1) */
        chk('chip.labels', texts('.chip__label').join('|'), '去新增|已完善|已选 3 / 5')
        chkR('chip.icon.w', '.chip .ic', 13, 2) /* design 图层 fs=11 → 宽 13 */

        /* ===================== 卡1 报价主体：选择框（design d7730eba h48 r12 padding 0/14 stroke 0.8 #2563EB） == */
        chkR('subjectSelect.x', '[data-testid="subject-select"]', 32, 1)
        chkR('subjectSelect.top', '[data-testid="subject-select"]', 178, 2) /* PNG 描边行 177/178 */
        chkR('subjectSelect.w', '[data-testid="subject-select"]', 366, 1)
        chkR('subjectSelect.h', '[data-testid="subject-select"]', 48, 1)
        chkC('subjectSelect.radius', '[data-testid="subject-select"]', 'borderRadius', 12)
        chkC('subjectSelect.padLeft', '[data-testid="subject-select"]', 'paddingLeft', 14)

        chk('subjectSelect.stroke.declared', declared('[data-testid="subject-select"]', 'boxShadow') || declared('.select--active', 'boxShadow'), 'rgb(37, 99, 235) 0px 0px 0px 0.8px')
        chk('subjectSelect.stroke.used', css('[data-testid="subject-select"]', 'boxShadow'), 'rgb(37, 99, 235) 0px 0px 0px 0.8px') /* Chrome 对 box-shadow 的 used 值保留 0.8px（本轮实测） */
        chkC('subjectSelect.bg', '[data-testid="subject-select"]', 'backgroundColor', 'rgb(255, 255, 255)')

        document.getElementById('m').textContent = 'MEASURE_JSON:' + JSON.stringify(acc)
      }

      function phase(n) {
        try {
          var payload = collect(f.contentDocument, f.contentWindow, n === 2)
          if (n === 2 && !SHOT_ONLY) {
            f.style.height = '900px' /* 保持取数高度：min-height:100vh 会把测量高度顶到 iframe 高 */
            acc.iframeHeightForShot = payload.docScrollHeight
          }
          sink(n, payload)
        } catch (e) {
          sink(n, { error: String(e && e.message) })
        }
      }

      function clickIn(sel) {
        var doc = f.contentDocument
        var el = doc.querySelector(sel)
        if (!el) return 'NOT_FOUND'
        var ev = doc.createEvent('MouseEvents')
        ev.initMouseEvent('click', true, true, f.contentWindow, 0, 0, 0, 0, 0, false, false, false, false, 0, null)
        el.dispatchEvent(ev)
        return 'CLICKED'
      }

      function fillName(value) {
        /* uni-app H5：<input> 渲染为 <uni-input> 宿主 + 内层原生 input；必须写内层并派发 input 事件 */
        var host = f.contentDocument.querySelector('uni-input[data-testid="name-input"]')
        var el = host ? host.querySelector('input') : null
        if (!el) return 'NOT_FOUND'
        el.focus()
        el.value = value
        el.dispatchEvent(new Event('input', { bubbles: true }))
        return 'FILLED'
      }

      function toastText(doc) {
        var el = doc.querySelector('uni-toast .uni-toast__content, .uni-toast__content, uni-toast')
        return el ? el.textContent.trim() : ''
      }

      f.addEventListener('load', function () {
        setTimeout(function () { phase(1) }, 2200)
        /* 选凭证 c1（真实请求 → serve 实收 GET /api/v1/credentials/c1） */
        setTimeout(function () {
          clickIn('[data-testid="cred-select"]')
          setTimeout(function () { clickIn('[data-testid="cred-option-c1"]') }, 300)
        }, 3200)
        setTimeout(function () { fillName('2024Q3 主线路报价') }, 4200)
        setTimeout(function () { phase(2) }, 5600)
        if (SCENARIO !== 'actions') return
        /* phase3：点第 4 行 gemini-1.5-pro → 4/5；全选 → 5/5；全不选 → 0/5；再勾第 1 行 → 1/5 */
        setTimeout(function () {
          var c1 = clickIn('[data-testid="model-row-gemini-1.5-pro"]')
          setTimeout(function () {
            var doc = f.contentDocument
            var afterToggle = (doc.querySelector('[data-testid="chip-model-count"]') || {}).textContent
            var statusAfter = (doc.querySelectorAll('.model__status')[3] || {}).textContent
            clickIn('[data-testid="select-all"]')
            setTimeout(function () {
              var afterAll = (f.contentDocument.querySelector('[data-testid="chip-model-count"]') || {}).textContent
              clickIn('[data-testid="select-all"]')
              setTimeout(function () {
                var afterNone = (f.contentDocument.querySelector('[data-testid="chip-model-count"]') || {}).textContent
                clickIn('[data-testid="model-row-gpt-4o"]')
                setTimeout(function () {
                  sink(3, {
                    toggleClicked: c1,
                    countAfterToggle: (afterToggle || '').trim(),
                    statusAfterToggle: (statusAfter || '').trim(),
                    countAfterSelectAll: (afterAll || '').trim(),
                    countAfterUnselectAll: (afterNone || '').trim(),
                    nameValue: (f.contentDocument.querySelector('[data-testid="name-input"]') || {}).value,
                    nameCount: (f.contentDocument.querySelector('[data-testid="name-count"]') || {}).textContent,
                    hash: String(f.contentWindow.location.hash)
                  })
                }, 400)
              }, 400)
            }, 400)
          }, 500)
        }, 6200)
        /* phase4：点「保存」→ 真实 POST /quotes + POST /quotes/q9/items（serve 实收）→ toast + 跳转 */
        setTimeout(function () {
          var clicked = clickIn('[data-testid="btn-save"]')
          setTimeout(function () {
            var doc = f.contentDocument
            sink(4, {
              saveClicked: clicked,
              toast: toastText(doc),
              hash: String(f.contentWindow.location.hash),
              savedCountText: (doc.querySelector('[data-testid="chip-model-count"]') || {}).textContent
            })
          }, 2000)
        }, 9200)
      })
    </script>
  </body>
</html>
