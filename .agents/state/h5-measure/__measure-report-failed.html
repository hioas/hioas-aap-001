    <script>
      var f = document.getElementById('f')

      var SCENARIO = (location.search.match(/scenario=([a-z]+)/) || [])[1] || ''
      f.addEventListener('load', function () {

        setTimeout(function () { phase(2) }, 4200)
        if (SCENARIO === 'actions') setTimeout(function () { actions() }, 5000)

      /* 选择器语法：`sel@@N` = 该选择器的第 N 个匹配（也接受 CSS 里非法的 `sel#N` 写法，先归一化成 @@N）。
         `A@@N B C` = 在第 N 个 A 里查 B C。 */
      function splitSel(sel) {
        var s = String(sel).replace(/#(\d+)(?=\s|$)/g, '@@$1')
        var i = s.indexOf('@@')
        if (i === -1) return { base: s, n: 0, tail: '' }
        var head = s.slice(0, i)
        var rest = s.slice(i + 2).split(/\s+/)
        return { base: head.trim(), n: Number(rest[0]), tail: rest.slice(1).join(' ') }
      }

      function collect(doc, win) {
        var fails = []
        var checks = 0
        function norm(v) {
          if (typeof v === 'number') return v
          var s = String(v == null ? '' : v).trim()
          if (/^-?\d+(\.\d+)?px$/.test(s)) return Number(s.replace('px', ''))
          return s
        }
        function normColor(s) {
          var m = String(s || '').match(/rgba?\(([^)]+)\)/)
          if (!m) return String(s || '')
          var p = m[1].split(',').map(function (t) { return Number(t.trim()) })
          var a = p.length > 3 ? p[3] : 1
          return a === 1 ? 'rgb(' + p[0] + ', ' + p[1] + ', ' + p[2] + ')' : 'rgba(' + p.join(', ') + ')'
        }
        function declared(sel, prop) {
          /* CSSOM 声明值（非 used 值）：Chrome 会把 0.8px 报成 1px，所以判声明值 */
          var sp = splitSel(sel)
          if (!el(sel)) return null
          for (var i = 0; i < doc.styleSheets.length; i++) {
            var rules
            try { rules = doc.styleSheets[i].cssRules } catch (e) { continue }
            for (var j = 0; j < rules.length; j++) {
              var r = rules[j]
              if (!r.selectorText || r.selectorText.indexOf('[') === 0) continue
              var sels = r.selectorText.split(',').map(function (s) { return s.trim().replace(/\[data-v-[^\]]+\]/g, '') })
              if (sels.indexOf(sp.base) === -1) continue
              var v = r.style && r.style[prop]
              if (v) return v
            }
          }
          return null
        }
        function normDecl(s) { return String(s || '').replace(/\s+/g, ' ').trim() }
        /* box-shadow 的颜色要归一化，但**偏移/模糊/扩散必须保留** —— 早期写成 normColor() 会把整串
           压成只剩颜色（"rgba(15, 23, 42, 0.06) 0px 6px 20px 0px" → "rgba(15, 23, 42, 0.06)"），
           于是每条 box-shadow 检查都假失败。这里只替换颜色片段。 */
        function normShadow(s) {
          return String(s == null ? '' : s).replace(/rgba?\([^)]+\)/g, function (m) { return normColor(m) })
        }
        function el(sel) {
          var sp = splitSel(sel)
          if (!sp.n && !sp.tail) return doc.querySelector(sp.base)
          var roots = doc.querySelectorAll(sp.base)
          var root = roots[sp.n]
          if (!root) return null
          return sp.tail ? root.querySelector(sp.tail) : root
        }
        function rect(sel) {
          var e = el(sel)
          if (!e) return null
          var r = e.getBoundingClientRect()
          return {
            x: Math.round(r.x), top: Math.round(r.top), right: Math.round(r.right),
            bottom: Math.round(r.bottom), w: Math.round(r.width), h: Math.round(r.height)
          }
        }
        function css(sel, prop) {
          var e = el(sel)
          if (!e) return null
          var v = win.getComputedStyle(e)[prop]
          if (prop === 'boxShadow') return normShadow(v)
          return prop.toLowerCase().indexOf('color') >= 0 ? normColor(v) : norm(v)
        }
        function chk(key, got, want, tol) {
          checks++
          var t = tol == null ? 0 : tol
          var g = norm(got)
          var w = norm(want)
          /* 数值型比较：computed 的 fontWeight 是字符串 "700"，want 写的是数字 700 */
          var gn = typeof g === 'number' ? g : (typeof g === 'string' && /^-?\d+(\.\d+)?$/.test(g) ? Number(g) : null)
          var wn = typeof w === 'number' ? w : (typeof w === 'string' && /^-?\d+(\.\d+)?$/.test(w) ? Number(w) : null)
          var ok
          if (gn !== null && wn !== null) ok = Math.abs(gn - wn) <= t
          else ok = g === w
          if (!ok) fails.push({ k: key, got: got, want: want })
          return got
        }
        /* chkR 的字段由 key 末段决定：.h/.w/.x/.right/.top/.bottom（与调用处写成 xxx.h 一致） */
        function rectField(sel, key) {
          var r = rect(sel)
          if (!r) return null
          var f = String(key).split('.').pop()
          if (f === 'x' || f === 'left') return r.x
          if (f === 'right') return r.right
          if (f === 'top') return r.top
          if (f === 'bottom') return r.bottom
          if (f === 'w' || f === 'width') return r.w
          if (f === 'h' || f === 'height') return r.h
          return r
        }
        function chkR(key, sel, want, tol) { return chk(key, rectField(sel, key), want, tol) }
        function chkC(key, sel, prop, want, tol) { return chk(key, css(sel, prop), want, tol) }
        /* 数值数组逐项比较（设计帧是 Figma 小数坐标链，落地后会有 ±1 的取整差 →
           判「每个元素都在容差内」而不是把数组合成字符串精确比对） */
        function chkList(key, got, want, tol) {
          checks++
          var t = tol == null ? 0 : tol
          var ok = got.length === want.length
          if (ok) {
            for (var i = 0; i < got.length; i++) {
              if (Math.abs(got[i] - want[i]) > t) { ok = false; break }
            }
          }
          if (!ok) fails.push({ k: key, got: got.join(','), want: want.join(',') })
          return got
        }
        function rects(sel) {
          return Array.prototype.map.call(doc.querySelectorAll(sel), function (e) {
            var r = e.getBoundingClientRect()
            return { x: Math.round(r.x), top: Math.round(r.top), right: Math.round(r.right), w: Math.round(r.width), h: Math.round(r.height) }

        }
        function texts(sel) {

        }

        }

        }

          return e ? e.textContent.trim() : null
        }

        chkC('card2.weightText.color', '.weight-box__text', 'color', 'rgb(148, 163, 184)')
        chkC('card2.weightText.lh', '.weight-box__text', 'lineHeight', 18, 0.5)

        /* ---------- D2 详情卡（design 09ddc4ca · padding20 r18 · 1px #FECACA） ---------- */
        chkR('card3.x', '.card@@2', 16, 1)
        chkR('card3.w', '.card@@2', 398, 1)
        chkR('card3.top', '.card@@2', 768, 3)
        chkR('card3.h', '.card@@2', 166, 2)
        chkC('card3.padding', '.card@@2', 'paddingTop', 20)
        chk('card3.stroke', css('.card@@2', 'boxShadow'), 'rgb(254, 202, 202) 0px 0px 0px 1px')
        chkR('card3.head.h', '.detail__head', 20, 1)
        chkC('card3.title.fs', '.detail__title', 'fontSize', 14)
        chkC('card3.title.fw', '.detail__title', 'fontWeight', 600)
        chkC('card3.title.color', '.detail__title', 'color', 'rgb(15, 23, 42)')
        chkR('card3.title.left', '.detail__title', 36, 2)
        chkC('card3.score.fs', '.detail__score', 'fontSize', 14)
        chkC('card3.score.fw', '.detail__score', 'fontWeight', 700)
        chkC('card3.score.color', '.detail__score', 'color', 'rgb(220, 38, 38)')
        chkR('card3.score.right', '.detail__score', 394, 2)
        chk('card3.line.count', doc.querySelectorAll('.detail__line').length, 4)
        chkR('card3.line.h', '.detail__line', 20, 1) /* design 各行显式 height=20 */
        chkR('card3.line.left', '.detail__line', 36, 2)
        chkC('card3.line.fs', '.detail__line', 'fontSize', 12)
        chkC('card3.line.color', '.detail__line', 'color', 'rgb(100, 116, 139)')
        chkR('card3.line1.top', '.detail__line@@0', 816, 3)
        chk('card3.line.pitch', (function () { var r = rects('.detail__line'); return r.length > 1 ? r[1].top - r[0].top : null })(), 26, 1)

        /* ---------- 免责声明卡（design 1b0391c3 · padding[16,20,16,20] r18 · 1px #EEF2F7） ---------- */
        chkR('card4.x', '.card@@3', 16, 1)
        chkR('card4.w', '.card@@3', 398, 1)
        chkR('card4.top', '.card@@3', 946, 3)
        chkR('card4.h', '.card@@3', 68, 2) /* 16 + 36(两行 18) + 16 */
        chkC('card4.padTop', '.card@@3', 'paddingTop', 16)
        chkC('card4.padRight', '.card@@3', 'paddingRight', 20)
        chkC('card4.padBottom', '.card@@3', 'paddingBottom', 16)
        chkC('card4.padLeft', '.card@@3', 'paddingLeft', 20)
        chk('card4.stroke', css('.card@@3', 'boxShadow'), 'rgb(238, 242, 247) 0px 0px 0px 1px')
        chkR('card4.icon.w', '.card@@3 .glyph', 22, 1) /* design 831e1d09：20px remixicon 行框 22×30 */
        chkR('card4.icon.h', '.card@@3 .glyph', 30, 1)
        chkR('card4.text.left', '.disclaimer__textbox', 70, 2) /* 36 + 图标 22 + 12 */
        chkC('card4.title.fs', '.disclaimer__title', 'fontSize', 12)
        chkC('card4.title.fw', '.disclaimer__title', 'fontWeight', 500) /* design 60454a44 Medium */
        chkC('card4.title.color', '.disclaimer__title', 'color', 'rgb(100, 116, 139)')
        chkC('card4.title.lh', '.disclaimer__title', 'lineHeight', 18, 0.5)
        chkC('card4.text.fs', '.disclaimer__text', 'fontSize', 11)
        chkC('card4.text.color', '.disclaimer__text', 'color', 'rgb(148, 163, 184)')
        chkC('card4.text.lh', '.disclaimer__text', 'lineHeight', 18, 0.5)

        /* ---------- 底部操作（design e60b6a5c · padding[12,16,24,16] · 非圆角、随文档流） ---------- */
        chkR('bar.top', '.action', 1030, 3)
        chkR('bar.h', '.action', 80, 1) /* 12 + 44 + 24 */
        chkR('bar.w', '.action', 430, 1)
        chkC('bar.bg', '.action', 'backgroundColor', 'rgb(255, 255, 255)')
        chkC('bar.padTop', '.action__inner', 'paddingTop', 12)
        chkC('bar.padRight', '.action__inner', 'paddingRight', 16)
        chkC('bar.padBottom', '.action__inner', 'paddingBottom', 24)
        chkC('bar.padLeft', '.action__inner', 'paddingLeft', 16)
        chkR('bar.ghost.x', '.action__ghost', 16, 1)
        chkR('bar.ghost.w', '.action__ghost', 193, 1) /* design adc9d8c6 显式 width=193 */
        chkR('bar.ghost.h', '.action__ghost', 44, 1)
        chkC('bar.ghost.radius', '.action__ghost', 'borderRadius', 12)
        chk('bar.ghost.stroke', css('.action__ghost', 'boxShadow'), 'rgb(203, 213, 225) 0px 0px 0px 1px')
        chk('bar.ghost.iconCount', doc.querySelectorAll('.action__ghost .glyph').length, 0) /* design 导出PDF按钮唯一子节点是文本 */
        chkR('bar.ghostText.left', '.action__ghost-text', 83, 4) /* PNG y=1064：文本 ink x83..140，居中于 16..209 */
        chkC('bar.ghostText.fs', '.action__ghost-text', 'fontSize', 14)
        chkC('bar.ghostText.fw', '.action__ghost-text', 'fontWeight', 500) /* design b0ef1c50 Medium */
        chkC('bar.ghostText.color', '.action__ghost-text', 'color', 'rgb(71, 85, 105)')
        chkR('bar.primary.x', '.action__primary', 221, 2) /* 209 + 12 */
        chkR('bar.primary.w', '.action__primary', 193, 2)
        chkR('bar.primary.h', '.action__primary', 44, 1)
        chkC('bar.primary.radius', '.action__primary', 'borderRadius', 12)
        chkC('bar.primary.bg', '.action__primary', 'backgroundColor', 'rgb(37, 99, 235)')
        chkC('bar.primaryText.fs', '.action__primary-text', 'fontSize', 14)
        chkC('bar.primaryText.fw', '.action__primary-text', 'fontWeight', 600) /* design 47fa4d89 SemiBold */
        chkC('bar.primaryText.color', '.action__primary-text', 'color', 'rgb(255, 255, 255)')

        /* ---------- 整页 ---------- */
        chk('page.docHeight', Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight), 1110, 4)
        chkC('page.bg', '.rf-page', 'backgroundColor', 'rgb(248, 250, 252)')
        chk('page.cardCount', doc.querySelectorAll('.card').length, 4)
        chk('page.tabbarAbsent', doc.querySelectorAll('[data-testid="tabbar"]').length, 0)
        /* ⚠️ 设计帧是 Figma 小数坐标链（卡1 真值 254.5 → 累计到整页 1110.5），落地取整后
           卡顶/卡高整体 +1 —— 判「逐项 ±2」而不是精确字符串，避免把取整差报成页面缺陷 */
        chkList('page.cardTops', rects('.card').map(function (r) { return r.top }), [108, 374, 768, 946], 2)
        chkList('page.cardHeights', rects('.card').map(function (r) { return r.h }), [254, 382, 166, 68], 2)

        /* ---------- 文案（设计稿原文逐字） ---------- */
        var text = (doc.body && doc.body.innerText) || ''
        var need = [
          '检测报告', '报告编号 DR-20240614-0312',
          '综合检测结论', '华南备线路 · 备用通道', '54', '综合评分', '满分 100', '未通过',
          '命中一票否决项：D2 鉴权在检测期间返回 401，模型清单存在 1 项无法调用。',
          '请核对 APIKey 有效期与模型开放范围后重新提交检测；已通过项无需重复准备。',
          '分项总览',
          'D1 连通性', 'D2 鉴权', 'D3 模型一致性', 'D4 上下文', 'D5 稳定性', 'D6 计费口径', 'D7 合规安全', 'D8 并发压测',
          '89', '12', '55', '82', '61', '66', '58', '0',
          'D2 鉴权为关键项，未通过将直接判定为“未通过”；其余分项仅作参考。',
          'D2 鉴权有效性 · 详情', '12 分',
          '· 现象：第 3 次探测返回 401 Unauthorized。',
          '· 依据：APIKey 与 BaseURL 不匹配，或密钥已轮换失效。',
          '· 影响：无法建立稳定转发链路，暂不可承接业务。',
          '· 建议：更新 APIKey 后重新提交检测。',
          '本报告基于抽样检测生成', '未通过结论仅代表检测时点状态，修正后重新检测即可更新结论。',
          '导出 PDF', '重新提交检测'
        ]
        var missing = need.filter(function (t) { return text.indexOf(t) === -1 })
        chk('text.missing', missing.join('|'), '')

        /* ---------- 溢出（不计 uni-app 自身测量元素：uni-resize-sensor / uni-picker 内部空 div） ---------- */
        var over = []
        doc.querySelectorAll('*').forEach(function (e) {
          if (e.closest && e.closest('uni-resize-sensor')) return
          var r = e.getBoundingClientRect()
          if (r.width > 0 && r.right > win.innerWidth + 0.5) {
            over.push({ tag: e.tagName, cls: String(e.className || '').slice(0, 60), right: Math.round(r.right) })
          }
        })
        chk('overflow.count', over.length, 0)

        return {
          innerWidth: win.innerWidth,
          docScrollWidth: doc.documentElement.scrollWidth,
          docScrollHeight: Math.max(doc.documentElement.scrollHeight, doc.body.scrollHeight),
          checkCount: checks,
          checkFailCount: fails.length,
          checkFails: fails,
          overflowing: over.slice(0, 10),
          title: textOf('[data-testid="title"]'),
          reportNo: textOf('[data-testid="report-no"]'),
          score: textOf('[data-testid="score"]'),
          resultChip: textOf('[data-testid="result-chip"]'),
          chipRect: rect('[data-testid="result-chip"]'),
          dimLabels: texts('[data-testid="dim-label"]'),
          dimScores: texts('[data-testid="dim-score"]'),
          dimFillColors: colors('[data-testid="dim-fill"]'),
          dimScoreColors: textColors('[data-testid="dim-score"]'),
          dimFillWidths: rects('[data-testid="dim-fill"]').map(function (r) { return r.w }),
          dimRows: rects('.dim-row'),
          cardRects: rects('.card'),
          /* 顶部栏「报告编号」实测留证（前缀口径核定用 · 见 evidence/序号6-报告编号前缀核定.txt） */
          topbarNo: {
            text: textOf('.rf-page__no'),
            rect: rect('.rf-page__no'),
            lineHeight: css('.rf-page__no', 'lineHeight'),
            fontWeight: css('.rf-page__no', 'fontWeight')
          },
          cardTops: rects('.card').map(function (r) { return r.top }),
          cardHeights: rects('.card').map(function (r) { return r.h }),
          topbar: rect('.rf-page__topbar'),
          track: rect('.dim__track'),
          weightBox: rect('.weight-box'),
          detailCard: rect('[data-testid="detail-card"]'),
          disclaimerCard: rect('.card--disclaimer'),
          bar: rect('.action'),
          ghostBtn: rect('[data-testid="export-btn"]'),
          primaryBtn: rect('[data-testid="resubmit-btn"]'),
          missingTexts: missing,
          userAgent: win.navigator.userAgent
        }
      }

      function sink(n, payload) {
        acc['phase' + n] = payload
        document.getElementById('m').textContent = 'MEASURE_JSON:' + JSON.stringify(acc)
      }

      function phase(n) {
        try {
          var payload = collect(f.contentDocument, f.contentWindow)
          if (n === 2) {
            f.style.height = payload.docScrollHeight + 'px'
            acc.iframeHeightForShot = payload.docScrollHeight
          }
          sink(n, payload)
        } catch (e) {
          sink(n, { error: String(e && e.message) })
        }
      }

      /* 交互回放：点真实按钮，读真实效果（toast 文案 / uni-app 路由跳转）。
         校验门与真实请求由 serve 实收请求行证明（review-measure.sh 采集）。 */
      function clickIn(sel) {
        var doc = f.contentDocument
        var el = doc.querySelector(sel)
        if (!el) return 'NOT_FOUND'
        var ev = doc.createEvent('MouseEvents')
        ev.initMouseEvent('click', true, true, f.contentWindow, 0, 0, 0, 0, 0, false, false, false, false, 0, null)
        el.dispatchEvent(ev)
        return 'CLICKED'
      }

      function toastText(doc) {
        var el = doc.querySelector('uni-toast .uni-toast__content, .uni-toast__content, uni-toast')
        return el ? el.textContent.trim() : ''
      }

      function actions() {
        try {
          var doc = f.contentDocument
          var win = f.contentWindow
          var hash0 = win.location.hash
          var clicked = clickIn('[data-testid="export-btn"]')
          setTimeout(function () {
            sink(3, {
              clicked: clicked,
              toast: toastText(doc),
              hashUnchanged: win.location.hash === hash0,
              hash: win.location.hash
            })
            var clicked2 = clickIn('[data-testid="resubmit-btn"]')
            setTimeout(function () {
              sink(4, {
                clicked: clicked2,
                hash: String(win.location.hash),
                toast: toastText(doc),
                detectingTitle: (function () {
                  var e = doc.querySelector('.detecting-page__title')
                  return e ? e.textContent.trim() : null
                })(),
                detectingBodyHead: (doc.body && doc.body.innerText || '').slice(0, 60)
              })
            }, 2500)
          }, 900)
        } catch (e) {
          sink(3, { error: String(e && e.message) })
        }
      }
    </script>
