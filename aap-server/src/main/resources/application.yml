spring:
  application:
    name: aap-server
  profiles:
    default: dev
  datasource:
    # 变量来自 E:\env\aap-server.env（真实值不入库；缺失时启动即失败，不静默用默认值）
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aap_server_dev}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
      pool-name: aap-pool
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    # Spring Boot 4 使用 Jackson 3（tools.jackson.*）：WRITE_DATES_AS_TIMESTAMPS 等已被移除，
    # 时间默认按 ISO-8601 输出（RFC3339 UTC），此处只保留仍然有效的开关。
    default-property-inclusion: always

server:
  port: ${SERVER_PORT:8084}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    whitelabel:
      enabled: false

mybatis-flex:
  global-config:
    print-banner: false
    logic-delete-column: deleted
    normal-value-of-logic-delete: false
    deleted-value-of-logic-delete: true
    version-column: version
    default-page-size: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  jwt:
    # 生产/开发均从 E:\env\aap-server.env 注入（AAP_JWT_SECRET）
    secret: ${AAP_JWT_SECRET}
    access-ttl-minutes: ${AAP_JWT_ACCESS_TTL_MINUTES:120}
    refresh-ttl-days: ${AAP_JWT_REFRESH_TTL_DAYS:14}
  detection:
    # 供应商日检测配额（R-09）与通过线
    daily-quota: 5
    pass-score: 70
    veto-score: 40
    # 定期复测（AC-49）：报告有效期 30 天，到期自动入队复测（RECHECK 不计日配额）
    recheck-interval-days: 30
    recheck-enabled: ${AAP_RECHECK_ENABLED:true}
    recheck-cron: ${AAP_RECHECK_CRON:0 15 * * * *}
  credential:
    # 凭证加密密钥（AES-256-GCM，32 字节 base64；与库分离，R-06）
    aes-key: ${AAP_CREDENTIAL_AES_KEY}
    # 出站地址防护（SSRF，R-07）：默认不放行环回地址；仅本地联调/测试可临时开启
    allow-loopback: ${AAP_ALLOW_LOOPBACK:false}
  sms:
    ttl-seconds: 300
    resend-interval-seconds: 60
    max-attempts: 5
    lock-minutes: 15
    # 仅测试环境置 true：把验证码放进响应体便于端到端验收（生产严禁开启）
    # 是否把验证码回显在响应里：默认 false（生产红线）；仅本地联调时用 AAP_SMS_EXPOSE_CODE=true 打开
    expose-code: ${AAP_SMS_EXPOSE_CODE:false}
  logging:
    dir: ${LOG_DIR:logs}
  usage:
    # 小时用量聚合的日志源文件（本项目 mock 适配器；真实 new-api 日志拉取未接入 → 未配置时 ADM-U02 回 E-1801）
    log-file: ${AAP_USAGE_LOG_FILE:}

logging:
  level:
    root: info
