spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_TEST_NAME:aap_server_test}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    clean-disabled: false

app:
  jwt:
    secret: ${AAP_JWT_SECRET}
  detection:
    # 测试环境关闭定时复测：与用例抢库会产生不可复现的随机失败（逻辑由 RecheckServiceTest 直接驱动）
    recheck-enabled: false
  credential:
    aes-key: ${AAP_CREDENTIAL_AES_KEY}
    # 本地端到端联调/测试：允许 127.0.0.1 的上游桩（**不放行私网/链路本地/元数据地址**，AC-29 仍可验证）
    allow-loopback: true
  sms:
    # 测试环境把验证码放进响应体（dev_code），生产必须 false（application.yml 默认 false）
    expose-code: true
  usage:
    # 用量聚合的日志源（本项目 mock 适配器）：聚合用例自行写入该文件后调 ADM-U02
    log-file: ${java.io.tmpdir}/aap-usage-log-fixture.json
  logging:
    dir: ${LOG_DIR:logs}

logging:
  level:
    root: info
    com.mybatisflex: warn
